<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LedgerAI 智账 · 主界面</title>
<style>
  :root { --ink:#1f2733; --muted:#5d6675; --rule:#e0ddd4; --accent:#0f766e; --soft:#e6f2f0; --danger:#b91c1c; --amber:#b45309; --amber-soft:#fbf0e2; --bg:#faf9f6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  .hidden { display:none !important; }
  .layout { display:grid; grid-template-columns:150px 1fr 230px; height:100vh; }
  .topbar { grid-column:1/4; display:flex; align-items:center; gap:1rem; padding:.5rem 1rem; background:#fff; border-bottom:2px solid var(--ink); }
  .topbar .brand { font-weight:700; color:var(--accent); }
  .topbar select, .topbar input { padding:.25rem .5rem; border:1px solid var(--rule); border-radius:6px; }
  .topbar .spacer { flex:1; }
  .side { border-right:1px solid var(--rule); background:#fff; padding:.6rem .4rem; overflow-y:auto; }
  .side div { padding:.55rem .8rem; border-radius:8px; cursor:pointer; margin-bottom:.15rem; }
  .side div:hover { background:var(--soft); }
  .side div.active { background:var(--soft); color:var(--accent); font-weight:700; }
  .main { overflow-y:auto; padding:1rem 1.2rem; }
  .rpanel { border-left:1px solid var(--rule); background:#fff; padding:.8rem; overflow-y:auto; }
  .rpanel h4 { font-size:.8rem; color:var(--accent); margin:.6rem 0 .3rem; }
  .rpanel .kv { display:flex; justify-content:space-between; font-size:.8rem; padding:.15rem 0; }
  .rpanel .remind { background:var(--amber-soft); border-radius:6px; padding:.4rem .5rem; font-size:.75rem; margin-bottom:.3rem; }
  .card { background:#fff; border:1px solid var(--rule); border-radius:10px; padding:.8rem 1rem; margin-bottom:.8rem; }
  .bubble { max-width:88%; margin-bottom:.7rem; padding:.55rem .8rem; border-radius:10px; white-space:pre-wrap; font-size:.88rem; }
  .bubble.user { background:var(--soft); margin-left:auto; }
  .bubble.ai { background:#fff; border:1px solid var(--rule); }
  .bubble .warn { background:var(--amber-soft); color:var(--amber); border-radius:6px; padding:.25rem .5rem; margin:.25rem 0; font-size:.8rem; }
  table { width:100%; border-collapse:collapse; font-size:.82rem; background:#fff; }
  th { background:var(--ink); color:#fff; padding:.4rem .5rem; text-align:left; white-space:nowrap; }
  td { padding:.35rem .5rem; border-bottom:1px solid var(--rule); }
  tr:last-child td { border-bottom:none; }
  td.num, th.num { text-align:right; font-family:Consolas,monospace; }
  .total-row td { font-weight:700; background:var(--soft); }
  .rollup-row td { font-weight:700; background:#f4f2ec; }
  input, select, textarea { padding:.35rem .5rem; border:1px solid var(--rule); border-radius:6px; font-size:.85rem; }
  button { padding:.4rem .9rem; border:none; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; font-size:.85rem; }
  button.ghost { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  button.danger { background:var(--danger); }
  button:disabled { background:#ccc; cursor:not-allowed; }
  .vc-line { display:grid; grid-template-columns:1fr 140px 120px 90px 90px 26px; gap:.35rem; margin-bottom:.35rem; align-items:center; }
  .vc-totals { display:flex; gap:1.2rem; justify-content:flex-end; font-family:Consolas,monospace; font-size:.85rem; padding:.4rem 0; }
  .diff-bad { color:var(--danger); font-weight:700; }
  .diff-ok { color:var(--accent); font-weight:700; }
  .chips { display:flex; gap:.4rem; flex-wrap:wrap; margin:.4rem 0; }
  .chip { background:#fff; border:1px solid var(--rule); border-radius:14px; padding:.2rem .7rem; font-size:.78rem; cursor:pointer; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  .chip.on { border-color:var(--accent); color:var(--accent); font-weight:700; }
  #loginView { max-width:360px; margin:12vh auto; }
  #loginView input { width:100%; margin-bottom:.7rem; }
  .inputbar { display:flex; gap:.5rem; align-items:center; background:#fff; border:1px solid var(--rule); border-radius:10px; padding:.5rem; position:sticky; bottom:.5rem; }
  .inputbar input[type=text] { flex:1; border:none; outline:none; }
  .badge { font-size:.72rem; padding:.1rem .5rem; border-radius:10px; background:var(--soft); color:var(--accent); font-weight:700; }
  .badge.gray { background:#eee; color:var(--muted); }
  h3.view-title { margin-bottom:.8rem; }
  a.link { color:var(--accent); text-decoration:underline; cursor:pointer; }
</style>
</head>
<body>

<div id="loginView" class="card">
  <h3 style="margin-bottom:.8rem">LedgerAI 智账 · 登录</h3>
  <input id="l_user" placeholder="用户名" value="admin">
  <input id="l_pass" type="password" placeholder="密码">
  <button style="width:100%" onclick="login()">登录</button>
  <div id="l_err" style="color:var(--danger);font-size:.82rem;margin-top:.5rem"></div>
</div>

<div class="layout hidden" id="mainView">
  <div class="topbar">
    <span class="brand">智账 LedgerAI</span>
    <span id="bookName" class="badge">…</span>
    <span>期间 <input type="month" id="period" onchange="onPeriodChange()"></span>
    <span class="spacer"></span>
    <span id="whoami" class="badge gray"></span>
    <button class="ghost" onclick="logout()">退出</button>
  </div>

  <div class="side" id="sideNav">
    <div class="active" data-view="chat">💬 对话记账</div>
    <div data-view="vouchers">📋 凭证</div>
    <div data-view="accounts">🗂 科目设置</div>
    <div data-view="contacts">🤝 往来单位</div>
    <div data-view="tb">📊 科目余额表</div>
    <div data-view="reports">📑 报表模块</div>
    <div data-view="opening">🏁 期初余额</div>
    <div data-view="invoices">🧾 发票</div>
    <div data-view="tax">💰 报税</div>
    <div data-view="users">👥 用户管理</div>
    <div data-view="llm">🤖 模型设置</div>
  </div>

  <div class="main" id="mainArea"></div>

  <div class="rpanel">
    <h4>⏰ 征期提醒（30 天内）</h4>
    <div id="rp_reminders">…</div>
    <h4>💡 本期概要</h4>
    <div id="rp_summary">…</div>
  </div>
</div>

<script>
let TOKEN = localStorage.getItem('ledger_token') || '';
let ROLE = localStorage.getItem('ledger_role') || '';
let BOOK = { id: 1, name: '' };
let PERIOD = new Date().toISOString().slice(0, 7);
let ACCOUNTS = [];
let CONTACTS = [];
let currentView = 'chat';
let chatLog = [];

const $ = id => document.getElementById(id);
const STATUS_CN = { draft:'草稿', submitted:'待审核', audited:'已审核', posted:'已过账', voided:'已冲销' };
const SOURCE_CN = { manual:'手工', ai:'AI生成', carryover:'结转', reverse:'红冲' };
const ROLE_CN = { admin:'管理员', bookkeeper:'制单', auditor:'审核' };
const CTYPE_CN = { customer:'客户', supplier:'供应商', employee:'员工', other:'其他往来' };

async function api(path, options = {}) {
  const resp = await fetch(path, {
    ...options,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN, ...(options.headers || {}) },
  });
  if (resp.status === 401) { logout(true); throw new Error('登录已失效'); }
  if (resp.status === 204) return null;
  if (!resp.ok) {
    const detail = await resp.json().catch(() => ({}));
    throw new Error(detail.detail || ('HTTP ' + resp.status));
  }
  return resp.json();
}

function logout(expired) {
  localStorage.removeItem('ledger_token');
  TOKEN = '';
  $('mainView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  if (expired) $('l_err').textContent = '登录已失效，请重新登录';
}

async function login() {
  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('l_user').value, password: $('l_pass').value }),
    });
    if (!resp.ok) throw new Error((await resp.json()).detail || '登录失败');
    TOKEN = (await resp.json()).access_token;
    localStorage.setItem('ledger_token', TOKEN);
    await boot();
  } catch (e) { $('l_err').textContent = e.message; }
}

async function boot() {
  const me = await api('/api/auth/me');
  ROLE = me.role;
  localStorage.setItem('ledger_role', ROLE);
  $('whoami').textContent = `${me.display_name || me.username}（${ROLE_CN[me.role] || me.role}）`;
  try { BOOK = await api('/api/books/1'); }
  catch (e) { $('bookName').textContent = '未找到账套'; alert('未找到账套，请先执行 scripts/init_dev_db.py 初始化'); return; }
  $('bookName').textContent = BOOK.name;
  $('period').value = PERIOD;
  $('loginView').classList.add('hidden');
  $('mainView').classList.remove('hidden');
  await loadMasters();
  await Promise.all([loadReminders(), loadSummary()]);
  switchView('chat');
}

async function loadMasters() {
  const [tree, contacts] = await Promise.all([
    api(`/api/accounts?book_id=${BOOK.id}&only_active=false`),
    api(`/api/contacts?book_id=${BOOK.id}`),
  ]);
  const flat = [];
  (function walk(nodes) { nodes.forEach(n => { flat.push(n); if (n.children) walk(n.children); }); })(tree);
  ACCOUNTS = flat;
  CONTACTS = contacts;
}

function onPeriodChange() { PERIOD = $('period').value; loadSummary(); if (currentView !== 'chat') switchView(currentView); }

function switchView(view) {
  currentView = view;
  document.querySelectorAll('#sideNav div').forEach(el => el.classList.toggle('active', el.dataset.view === view));
  if (view === 'llm') { window.open('/settings', '_blank'); return; }
  ({ chat: renderChat, vouchers: renderVouchers, accounts: renderAccounts, contacts: renderContactsView, tb: renderTB, reports: renderReports,
     opening: renderOpening, invoices: renderInvoices, tax: renderTax, users: renderUsers })[view]();
}

function addBubble(html, cls = 'ai') {
  chatLog.push({ html, cls });
  const wrap = document.createElement('div');
  wrap.className = 'bubble ' + cls;
  wrap.innerHTML = html;
  const flow = $('chatFlow');
  if (!flow) return;
  flow.appendChild(wrap);
  flow.parentElement.scrollTop = flow.parentElement.scrollHeight;
}

/* ---------- 对话视图 ---------- */
function renderChat() {
  $('mainArea').innerHTML = `
    <div id="chatFlow" style="height:calc(100vh - 190px); overflow-y:auto; padding-right:.3rem"></div>
    <div class="chips" id="chips"></div>
    <div class="inputbar">
      <input type="file" id="chatFile" class="hidden">
      <button class="ghost" onclick="$('chatFile').click()" title="上传单据">📎</button>
      <input type="text" id="chatInput" placeholder="输入业务描述，或上传单据文件（回车发送）" onkeydown="if(event.key==='Enter')send()">
      <button class="ghost" onclick="newManualCard()">＋ 新增凭证</button>
      <button onclick="send()">发送</button>
    </div>`;
  const flow = $('chatFlow');
  chatLog.forEach(m => { const div = document.createElement('div'); div.className = 'bubble ' + m.cls; div.innerHTML = m.html; flow.appendChild(div); });
  flow.scrollTop = flow.scrollHeight;
  ['本月收入多少', '本月费用有哪些', '这个月利润', '看看余额表'].forEach(q => {
    const c = document.createElement('span');
    c.className = 'chip'; c.textContent = q;
    c.onclick = () => { $('chatInput').value = q; send(); };
    $('chips').appendChild(c);
  });
  $('chatFile').onchange = () => { if ($('chatFile').files[0]) send(); };
}

function contactOptions(selected, allowedTypes) {
  const usable = CONTACTS.filter(c =>
    c.is_active && (!allowedTypes || !allowedTypes.length || allowedTypes.includes(c.ctype)));
  return `<option value="">往来单位</option>` +
    usable.map(c =>
      `<option value="${c.id}" ${Number(selected) === c.id ? 'selected' : ''}>${c.name}（${CTYPE_CN[c.ctype] || c.ctype}）</option>`).join('');
}

function auxTypesOf(accountCode) {
  const a = ACCOUNTS.find(x => x.code === accountCode);
  return (a && a.aux_types ? a.aux_types : '')
    .split(',').filter(Boolean).map(x => x.replace('contact:', '')).filter(x => x !== 'contact');
}

function lineEditorHTML(lines, updFn, delFn) {
  return lines.map((line, i) => `
    <div class="vc-line">
      <input value="${line.summary || ''}" placeholder="摘要" onchange="${updFn}(${i},'summary',this.value)">
      <select onchange="${updFn}(${i},'account_code',this.value)">
        <option value="">选择科目</option>
        ${ACCOUNTS.filter(a => a.is_active && a.is_leaf).map(a =>
          `<option value="${a.code}" ${a.code === line.account_code ? 'selected' : ''}>${a.code} ${a.name}</option>`).join('')}
      </select>
      <select onchange="${updFn}(${i},'contact_id',this.value?parseInt(this.value):null)">
        ${contactOptions(line.contact_id, auxTypesOf(line.account_code))}
      </select>
      <input class="num" value="${line.debit || ''}" placeholder="借方" onchange="${updFn}(${i},'debit',this.value)">
      <input class="num" value="${line.credit || ''}" placeholder="贷方" onchange="${updFn}(${i},'credit',this.value)">
      <button class="small danger" onclick="${delFn}(${i})">×</button>
    </div>`).join('');
}

function totalsHTML(lines) {
  const total = lines.reduce((acc, l) => acc + (parseFloat(l.debit) || 0), 0);
  const diff = (lines.reduce((acc, l) => acc + (parseFloat(l.debit) || 0) - (parseFloat(l.credit) || 0), 0)).toFixed(2);
  const ok = Math.abs(diff) < 0.005;
  return { total, diff, ok, html: `<div class="vc-totals"><span>借方合计 ${total.toFixed(2)}</span><span>贷方合计 ${total.toFixed(2)}</span><span class="${ok ? 'diff-ok' : 'diff-bad'}">差额 ${diff}</span></div>` };
}

function cardHTML(v, mode) {
  const t = totalsHTML(v.lines);
  return `
    <div class="card" id="vcCard">
      <div style="display:flex;gap:.8rem;align-items:center;margin-bottom:.5rem;flex-wrap:wrap">
        <b>凭证日期</b><input type="date" id="vc_date" value="${v.voucher_date}">
        <b>附单据数</b><input id="vc_att" type="number" min="0" value="${v.attachment_count ?? 1}" style="width:60px">
        <span class="badge ${mode === 'ai' ? '' : 'gray'}">${mode === 'ai' ? 'AI 生成 · 可编辑' : '手工录入'}</span>
      </div>
      <div class="vc-line" style="font-weight:700;color:var(--muted)"><span>摘要</span><span>科目</span><span>往来单位</span><span style="text-align:right">借方</span><span style="text-align:right">贷方</span><span></span></div>
      ${lineEditorHTML(v.lines, 'updLine', 'delLine')}
      <button class="small ghost" onclick="addLine()">＋ 加一行</button>
      ${t.html}
      <div id="vc_err" style="color:var(--danger);font-size:.82rem"></div>
      <button id="vc_confirm" onclick="confirmCard('${mode}')" ${t.ok ? '' : 'disabled'}>确认落账</button>
      ${mode === 'ai' ? `<button class="ghost" onclick="reSuggest()">重新生成</button>` : ''}
    </div>`;
}

let cardState = { mode: 'ai', voucher: null, docId: null };

function showCard(mode, voucher, docId) {
  cardState = { mode, voucher, docId };
  addBubble(cardHTML(voucher, mode));
}

function updLine(i, field, value) { cardState.voucher.lines[i][field] = value; refreshCardTotals(); }
function addLine() { cardState.voucher.lines.push({ summary: '', account_code: '', contact_id: null, debit: '', credit: '' }); rerenderCard(); }
function delLine(i) { cardState.voucher.lines.splice(i, 1); rerenderCard(); }
function rerenderCard() {
  const card = document.getElementById('vcCard');
  if (card) { card.outerHTML = cardHTML(cardState.voucher, cardState.mode); $('chatFlow').parentElement.scrollTop = $('chatFlow').parentElement.scrollHeight; }
}
function refreshCardTotals() {
  const card = document.getElementById('vcCard');
  if (!card) return;
  const t = totalsHTML(cardState.voucher.lines);
  card.querySelector('.vc-totals').outerHTML = t.html;
  card.querySelector('#vc_confirm').disabled = !t.ok;
}

function newManualCard() {
  if (currentView !== 'chat') switchView('chat');
  showCard('manual', {
    voucher_date: new Date().toISOString().slice(0, 10),
    lines: [
      { summary: '', account_code: '', contact_id: null, debit: '', credit: '' },
      { summary: '', account_code: '', contact_id: null, debit: '', credit: '' },
    ],
    attachment_count: 1,
  });
}

let CHAT_HISTORY = [];
let pendingAsk = null;
const TOOL_CN = {
  search_invoices: '查发票', query_balance: '查科目余额', query_vouchers: '查凭证',
  list_contacts: '查往来单位', find_or_create_contact: '建档往来单位', ask_user: '向用户提问',
};

async function send() {
  const text = $('chatInput').value.trim();
  const file = $('chatFile').files[0];
  if (!text && !file) return;
  addBubble((text || '') + (file ? ` 📎${file.name}` : ''), 'user');
  $('chatInput').value = ''; $('chatFile').value = '';

  if (/^看(看)??(余额表|资产负债表|利润表|现金流量表|凭证|发票|报税)/.test(text)) {
    const map = { 余额表: 'tb', 资产负债表: 'reports', 利润表: 'reports', 现金流量表: 'reports', 凭证: 'vouchers', 发票: 'invoices', 报税: 'tax' };
    const view = Object.keys(map).find(k => text.includes(k));
    addBubble(`好的，为你打开对应视图 👉`);
    switchView(map[view]);
    return;
  }

  try {
    if (pendingAsk && !file) {
      CHAT_HISTORY.push({ role: 'user', content: text });
      await agentChat(pendingAsk.docId);
      return;
    }
    let doc;
    if (file) {
      const form = new FormData();
      form.append('file', file);
      const resp = await fetch(`/api/ai/parse?book_id=${BOOK.id}`, { method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN }, body: form });
      if (!resp.ok) throw new Error((await resp.json()).detail || '解析失败');
      doc = await resp.json();
      const warnHtml = (doc.warnings || []).map(w => `<div class="warn">⚠ ${w}</div>`).join('');
      addBubble(`📄 已解析（${doc.source_kind}）：${Object.values(doc.fields).filter(v => v).join(' ｜ ') || '无字段'}${warnHtml}`);
    } else {
      doc = await api('/api/ai/parse', { method: 'POST', body: JSON.stringify({ book_id: BOOK.id, note: text }) });
    }
    CHAT_HISTORY.push({ role: 'user', content: text || `[文件] ${file.name}` });
    await agentChat(doc.doc_id);
  } catch (e) { addBubble(`❌ ${e.message}`); }
}

async function agentChat(docId) {
  const body = $('chatBox');
  const thinking = document.createElement('div');
  thinking.className = 'bubble ai';
  thinking.textContent = '⏳ 正在思考（可能需要查数据）…';
  body.appendChild(thinking); body.scrollTop = body.scrollHeight;
  const data = await api('/api/ai/chat', {
    method: 'POST',
    body: JSON.stringify({ book_id: BOOK.id, doc_id: docId, history: CHAT_HISTORY }),
  });
  thinking.remove();
  (data.trace || []).forEach(t => addTrace(t));
  CHAT_HISTORY.push({ role: 'assistant', content: data.reply });
  if (data.stopped_by_ask_user) {
    pendingAsk = { docId };
    addBubble(`🤖 ${data.reply}`);
    return;
  }
  pendingAsk = null;
  if (data.voucher) {
    data.voucher.lines.forEach(l => { if (l.contact_id === undefined) l.contact_id = null; });
    addBubble(`🤖 ${data.reply || '凭证已生成，请核对：'}`);
    showCard('ai', data.voucher, docId);
  } else {
    addBubble(`🤖 ${data.reply || '（无内容）'}`);
  }
}

function addTrace(t) {
  const box = $('chatBox');
  const args = Object.entries(t.arguments || {}).map(([k, v]) => (v ? `${k}=${v}` : '')).filter(Boolean).join(' ');
  const div = document.createElement('div');
  div.className = 'trace';
  div.textContent = `🛠 ${TOOL_CN[t.tool] || t.tool}${args ? ' · ' + args : ''}`;
  box.appendChild(div); box.scrollTop = box.scrollHeight;
}

async function reSuggest() {
  if (!cardState.docId) return;
  await agentChat(cardState.docId);
}

async function confirmCard(mode) {
  const card = document.getElementById('vcCard');
  const voucher_date = card.querySelector('#vc_date').value;
  const attachment_count = parseInt((card.querySelector('#vc_att') || {}).value || '0', 10);
  const errEl = card.querySelector('#vc_err');
  try {
    let voucher;
    if (mode === 'ai') {
      voucher = await api('/api/ai/confirm', {
        method: 'POST',
        body: JSON.stringify({ doc_id: cardState.docId, voucher_date, lines: cardState.voucher.lines }),
      });
    } else {
      voucher = await api(`/api/vouchers?book_id=${BOOK.id}`, {
        method: 'POST',
        body: JSON.stringify({ voucher_date, attachment_count, source: 'manual', lines: cardState.voucher.lines }),
      });
    }
    addBubble(`✅ 已落账：${voucher.voucher_no_display}（${STATUS_CN[voucher.status]}，待审核）`);
    document.getElementById('vcCard').remove();
    pendingAsk = null; loadSummary(); if (currentView === 'vouchers') renderVouchers();
  } catch (e) { errEl.textContent = '确认失败：' + e.message; }
}

/* ---------- 凭证模块 ---------- */
let VE = null;

async function renderVouchers() {
  $('mainArea').innerHTML = `<h3 class="view-title">📋 凭证（${PERIOD}）
    <select id="v_status" onchange="renderVouchers()" style="margin-left:.8rem">
      <option value="">全部状态</option>${Object.keys(STATUS_CN).map(s => `<option value="${s}">${STATUS_CN[s]}</option>`).join('')}
    </select>
    <button class="ghost small" style="margin-left:.8rem" onclick="newManualCard()">＋ 新建凭证</button></h3><div id="v_list">加载中…</div>`;
  const status = $('v_status').value;

    list.map(v => `<tr><td><a class="link" onclick="viewVoucher(${v.id})">${v.voucher_no_display}</a></td>
      <td>${v.voucher_date}</td><td>${STATUS_CN[v.status] || v.status}</td><td>${SOURCE_CN[v.source] || v.source}</td><td class="num">${v.total_debit}</td>
      <td><button class="small ghost" onclick="viewVoucher(${v.id})">查看${v.status === 'draft' ? '/编辑' : ''}</button></td></tr>`).join('') + '</table>'
    : '<div class="result">本期暂无凭证</div>';
}

async function viewVoucher(id) {
  const v = await api(`/api/vouchers/${id}`);
  v.lines.forEach(l => { if (l.contact_id === undefined) l.contact_id = null; });
  VE = { id, voucher: JSON.parse(JSON.stringify(v)), editable: v.status === 'draft' };
  renderVoucherDetail();
}

function renderVoucherDetail() {
  const v = VE.voucher;
  const contactName = id => (CONTACTS.find(c => c.id === id) || {}).name || '';
  const linesHtml = VE.editable
    ? lineEditorHTML(v.lines, 'veUpd', 'veDel')
    : `<table><tr><th>摘要</th><th>科目</th><th>往来单位</th><th class="num">借方</th><th class="num">贷方</th></tr>` +
      v.lines.map(line => `<tr><td>${line.summary}</td><td>${line.account_code}</td><td>${line.contact_id ? contactName(line.contact_id) : ''}</td><td class="num">${line.debit}</td><td class="num">${line.credit}</td></tr>`).join('') + '</table>';
  const t = totalsHTML(v.lines);
  $('mainArea').innerHTML = `
    <h3 class="view-title"><a class="link" onclick="switchView('vouchers')">← 凭证列表</a>
      ｜ ${v.voucher_no_display} <span class="badge">${STATUS_CN[v.status] || v.status}</span>
      <span class="badge gray">${SOURCE_CN[v.source] || v.source}</span></h3>
    <div class="card">
      <div style="margin-bottom:.5rem">凭证日期 <b>${v.voucher_date}</b> ｜ 附单据数 <b>${v.attachment_count}</b> ｜ 期间 ${v.period}</div>
      ${VE.editable ? `
        <div class="vc-line" style="font-weight:700;color:var(--muted)"><span>摘要</span><span>科目</span><span>往来单位</span><span style="text-align:right">借方</span><span style="text-align:right">贷方</span><span></span></div>
        ${linesHtml}
        <button class="small ghost" onclick="veAdd()">＋ 加一行</button>
        ${t.html}
        <div id="ve_err" style="color:var(--danger);font-size:.82rem"></div>
        <button onclick="veSave()" ${t.ok ? '' : 'disabled'}>保存修改</button>
        <button class="ghost" onclick="veSubmit()">提交审核</button>
        <button class="danger" onclick="veDelete()">删除凭证</button>`
      : `${linesHtml}
        <div class="vc-totals"><span>借方合计 ${v.total_debit}</span><span>贷方合计 ${v.total_credit}</span></div>
        ${ROLE !== 'bookkeeper' && v.status === 'submitted' ? `<button onclick="act('${v.id}','audit')">审核通过</button> <button class="ghost" onclick="act('${v.id}','reject')">驳回</button>` : ''}
        ${ROLE !== 'bookkeeper' && v.status === 'audited' ? `<button onclick="act('${v.id}','post')">过账</button>` : ''}
        ${ROLE !== 'bookkeeper' && v.status === 'posted' ? `<button class="ghost" onclick="act('${v.id}','unpost')">反过账</button> <button class="danger" onclick="veReverse()">红字冲销</button>` : ''}`}
    </div>`;
}

function veUpd(i, field, value) { VE.voucher.lines[i][field] = value; }
function veAdd() { VE.voucher.lines.push({ summary: '', account_code: '', contact_id: null, debit: '0', credit: '0' }); renderVoucherDetail(); }
function veDel(i) { VE.voucher.lines.splice(i, 1); renderVoucherDetail(); }

async function veSave() {
  try {
    VE.voucher = await api(`/api/vouchers/${VE.id}`, { method: 'PATCH', body: JSON.stringify({ lines: VE.voucher.lines }) });
    renderVoucherDetail();
  } catch (e) { $('ve_err').textContent = '保存失败：' + e.message; }
}
async function veSubmit() { try { await api(`/api/vouchers/${VE.id}/submit`, { method: 'POST' }); renderVouchers(); } catch (e) { alert('提交失败：' + e.message); } }
async function veDelete() { if (!confirm('确定删除该草稿凭证？')) return; try { await api(`/api/vouchers/${VE.id}`, { method: 'DELETE' }); renderVouchers(); } catch (e) { alert('删除失败：' + e.message); } }
async function veReverse() { if (!confirm('确定生成红字冲销凭证？')) return; try { await api(`/api/vouchers/${VE.id}/reverse`, { method: 'POST' }); renderVouchers(); } catch (e) { alert('冲销失败：' + e.message); } }

async function act(id, action) {
  try { await api(`/api/vouchers/${id}/${action}`, { method: 'POST' }); renderVouchers(); loadSummary(); }
  catch (e) { alert('操作失败：' + e.message); }
}

let auxEditCode = null;

async function renderAccounts() {
  $('mainArea').innerHTML = `<h3 class="view-title">🗂 科目设置</h3><div id="aux_panel"></div><div id="acc_body">加载中…</div>
    <div class="card" style="margin-top:1rem"><b>➕ 新增明细科目</b>
      <div class="vc-line" style="grid-template-columns:1fr 140px 140px auto">
        <select id="na_parent">${ACCOUNTS.filter(a => a.is_leaf && a.level < 3).map(a => `<option value="${a.code}">${a.code} ${a.name}</option>`).join('')}</select>
        <input id="na_code" placeholder="编码 如 5602.11">
        <input id="na_name" placeholder="科目名称">
        <button onclick="createAccount()">创建</button>
      </div><div id="na_err" style="color:var(--danger);font-size:.82rem"></div>
      <div class="result">往来单位档案请前往「🤝 往来单位」模块维护。</div></div>`;
  renderAccountTree();
}

function renderAccountTree() {
  const children = {};
  ACCOUNTS.forEach(a => {
    const key = a.parent_code || '_root';
    (children[key] = children[key] || []).push(a);
  });
  const rows = [];
  (function walk(list, depth) {
    list.sort((x, y) => x.code.localeCompare(y.code)).forEach(a => {
      const auxTypes = auxTypesOf(a.code);
      rows.push(`
        <tr class="${a.level === 1 ? 'rollup-row' : ''}" style="${a.is_active ? '' : 'opacity:.5'}">
          <td style="padding-left:${depth * 1.2}rem">${a.code} ${a.name}${a.is_preset ? '' : ' <span class="badge gray">自建</span>'}</td>
          <td>${auxTypes.length ? auxTypes.map(t => `<span class="badge">${CTYPE_CN[t] || t}</span>`).join('') : ''}</td>
          <td>${a.is_active ? '<span class="badge">启用</span>' : '<span class="badge gray">停用</span>'}</td>
          <td>${ROLE === 'admin' ? `
            <button class="small ghost" onclick="toggleAccount('${a.code}',${a.is_active})">${a.is_active ? '停用' : '启用'}</button>
            <button class="small ghost" onclick="openAuxEditor('${a.code}')">辅助核算</button>` : ''}</td>
        </tr>`);
      if (children[a.code]) walk(children[a.code], depth + 1);
    });
  })(children['_root'] || [], 0);
  $('acc_body').innerHTML = `<table><tr><th>科目</th><th>辅助核算（往来类型）</th><th>状态</th><th>操作（管理员）</th></tr>${rows.join('')}</table>
    <div class="result" style="margin-top:.5rem">说明：启用辅助核算后，录凭证选该科目必须选择对应类型的往来单位；默认已按标准配置（应收/预收→客户，应付/预付→供应商，其他应收/应付→员工与其他往来）；有发生额的科目修改配置会收到警示，修改对新凭证生效。</div>`;
}

function openAuxEditor(code) {
  auxEditCode = code;
  const account = ACCOUNTS.find(a => a.code === code);
  const current = auxTypesOf(code);
  const panel = $('aux_panel');
  panel.innerHTML = `<div class="card" style="border-color:var(--accent)">
    <b>辅助核算配置：${account.code} ${account.name}</b>
    <div class="chips" style="margin:.5rem 0">
      ${Object.keys(CTYPE_CN).map(t => `<span class="chip ${current.includes(t) ? 'on' : ''}" onclick="toggleAuxChip('${t}',this)">${CTYPE_CN[t]}</span>`).join('')}
    </div>
    <div id="aux_warn" style="color:var(--amber);font-size:.82rem"></div>
    <button onclick="saveAux('${code}')">保存配置</button>
    <button class="ghost" onclick="auxEditCode=null;$('aux_panel').innerHTML=''">取消</button>
    <div class="result">勾选即启用该类型的往来辅助核算；取消全部勾选=关闭辅助核算。</div>
  </div>`;
  panel.scrollIntoView({ behavior: 'smooth' });
}

function toggleAuxChip(type, el) {
  el.classList.toggle('on');
}

async function saveAux(code) {
  const panel = $('aux_panel');
  const types = [...panel.querySelectorAll('.chip.on')].map(el =>
    Object.keys(CTYPE_CN).find(k => CTYPE_CN[k] === el.textContent));
  try {
    const r = await api(`/api/accounts/${code}/aux?book_id=${BOOK.id}&aux_types=${types.map(t => 'contact:' + t).join(',')}`, { method: 'PATCH' });
    await loadMasters();
    renderAccountTree();
    $('aux_warn').textContent = r.warning || '配置已保存';
    if (r.warning) { const w = $('aux_warn'); w.style.color = 'var(--amber)'; }
  } catch (e) { $('aux_warn').textContent = '保存失败：' + e.message; $('aux_warn').style.color = 'var(--danger)'; }
}

async function toggleAccount(code, isActive) {
  try { await api(`/api/accounts/${code}?book_id=${BOOK.id}`, { method: 'PATCH', body: JSON.stringify({ is_active: !isActive }) }); await loadMasters(); renderAccountTree(); }
  catch (e) { alert('操作失败：' + e.message); }
}

async function createAccount() {
  try {
    await api('/api/accounts', {

      ${canEdit ? '<button onclick="saveOpening()">保存期初余额</button>' : '<div class="result">仅管理员可保存</div>'}`;
    updOpeningTotals();
    document.querySelectorAll('#t_body input').forEach(inp => inp.addEventListener('input', updOpeningTotals));
  } catch (e) { $('t_body').innerHTML = `<div class="result" style="color:var(--danger)">${e.message}</div>`; }
}

function updOpeningTotals() {
  let dr = 0, cr = 0;
  document.querySelectorAll('#t_body input').forEach(inp => {
    const v = parseFloat(inp.value) || 0;
    if (inp.dataset.side === 'debit') dr += v; else cr += v;
  });
  const el = document.getElementById('op_totals');
  if (el) el.innerHTML = `<span>借方合计 ${dr.toFixed(2)}</span><span>贷方合计 ${cr.toFixed(2)}</span><span class="${Math.abs(dr - cr) < 0.005 ? 'diff-ok' : 'diff-bad'}">差额 ${(dr - cr).toFixed(2)}</span>`;
}

async function saveOpening() {
  const seen = {};
  document.querySelectorAll('#t_body input').forEach(inp => {
    const v = parseFloat(inp.value);
    if (!v) return;
    const item = seen[inp.dataset.code] || { account_code: inp.dataset.code, debit: '0', credit: '0' };
    item[inp.dataset.side] = v.toFixed(2);
    seen[inp.dataset.code] = item;
  });
  const items = Object.values(seen);
  if (!items.length) { alert('请至少录入一条期初余额'); return; }
  try {
    await api(`/api/books/${BOOK.id}/opening`, { method: 'PUT', body: JSON.stringify({ items }) });
    alert('期初余额保存成功，余额表与报表的期初数已更新');
    loadSummary();
  } catch (e) { document.getElementById('op_err').textContent = '保存失败：' + e.message; }
}

/* ---------- 发票 / 报税 ---------- */
async function renderInvoices() {
  $('mainArea').innerHTML = `<h3 class="view-title">🧾 发票 <button class="ghost small" onclick="location.href='/docs'">去导入金税 Excel</button></h3><div id="t_body">加载中…</div>`;
  const list = await api(`/api/invoices?book_id=${BOOK.id}`);
  $('t_body').innerHTML = list.length ? `<table><tr><th>号码</th><th>日期</th><th>方向</th><th>类型</th><th class="num">价税合计</th><th>状态</th></tr>` +
    list.map(i => `<tr><td>${i.invoice_no}</td><td>${i.invoice_date}</td><td>${i.kind === 'sales' ? '销项' : '进项'}</td><td>${i.invoice_type}</td><td class="num">${i.amount_total}</td><td>${i.status}</td></tr>`).join('') + '</table>'
    : '<div class="result">暂无发票。可通过 /docs 的 POST /api/invoices/import 上传金税导出 Excel。</div>';
}

async function renderTax() {
  const [y, m] = PERIOD.split('-');
  const quarter = Math.ceil(parseInt(m, 10) / 3);
  $('mainArea').innerHTML = `<h3 class="view-title">💰 报税（${y}Q${quarter}）</h3><div id="t_body">加载中…</div>`;
  const vat = await api(`/api/tax/vat?book_id=${BOOK.id}&year=${y}&quarter=${quarter}`);
  const cit = await api(`/api/tax/cit?book_id=${BOOK.id}&year=${y}&quarter=${quarter}`);
  const reminders = await api('/api/tax/reminders?within_days=60');
  $('t_body').innerHTML = `
    <div class="card"><b>增值税（${y}Q${quarter}）</b>
      <div class="kv">季度销售额 ${vat.quarter_total_incl} ｜ 起征点 ${vat.threshold} ｜ ${vat.exempt ? '✅ 免税' : '全额计税'}</div>
      <div class="kv">应纳增值税 <b>${vat.vat_payable}</b> ｜ 附加税费 ${vat.surtax.total}</div>
      <div class="result">${vat.hints.join('；')}</div></div>
    <div class="card"><b>企业所得税预缴</b>
      <div class="kv">累计利润 ${cit.profit_ytd} ｜ ${cit.actual_rate} ｜ 本期应预缴 <b>${cit.prepaid_this}</b></div></div>
    <div class="card"><b>申报辅助表</b><button class="ghost small" onclick="window.open('/api/tax/export?book_id=${BOOK.id}&year=${y}&quarter=${quarter}')">导出 Excel</button></div>
    <div class="card"><b>近 60 天征期</b>${reminders.map(r2 => `<div class="kv">⏰ ${r2.due_date} ${r2.tax}（${r2.period}）</div>`).join('') || '<div class="result">无</div>'}</div>`;
}

/* ---------- 用户管理 ---------- */
async function renderUsers() {
  if (ROLE !== 'admin') {
    $('mainArea').innerHTML = '<div class="result">用户管理需要管理员权限，请使用 admin 账号登录后访问。</div>';
    return;
  }
  $('mainArea').innerHTML = `<h3 class="view-title">👥 用户管理</h3><div id="t_body">加载中…</div>`;
  const users = await api('/api/users');
  $('t_body').innerHTML = `<table><tr><th>用户名</th><th>姓名</th><th>角色</th><th>状态</th><th>操作</th></tr>` +
    users.map(u => `<tr><td>${u.username}</td><td>${u.display_name || ''}</td>
      <td><select onchange="patchUser(${u.id},{role:this.value})">
        ${['admin', 'bookkeeper', 'auditor'].map(r2 => `<option value="${r2}" ${u.role === r2 ? 'selected' : ''}>${ROLE_CN[r2]}</option>`).join('')}
      </select></td>
      <td>${u.is_active ? '<span class="badge">启用</span>' : '<span class="badge gray">停用</span>'}</td>
      <td><button class="small ghost" onclick="resetPwd(${u.id},'${u.username}')">重置密码</button>
      <button class="small ghost" onclick="patchUser(${u.id},{is_active:${!u.is_active}})">${u.is_active ? '停用' : '启用'}</button>
      <button class="small danger" onclick="delUser(${u.id},'${u.username}')">删除</button></td></tr>`).join('') + '</table>' +
    `<div class="card" style="margin-top:1rem"><b>新增用户</b>
      <div class="vc-line" style="grid-template-columns:1fr 1fr 1fr 1fr auto">
        <input id="nu_name" placeholder="用户名（≥3字符）"><input id="nu_pass" type="password" placeholder="密码（≥6字符）">
        <input id="nu_disp" placeholder="姓名"><select id="nu_role"><option value="bookkeeper">制单</option><option value="auditor">审核</option><option value="admin">管理员</option></select>
        <button onclick="createUser()">创建</button></div>
      <div id="nu_err" style="color:var(--danger);font-size:.82rem"></div>
      <div class="result">角色说明：制单（日常记账）/ 审核（审核与过账）/ 管理员（全部权限）。制单与审核必须不同账号。</div></div>`;
}

async function patchUser(id, body) {
  try { await api('/api/users/' + id, { method: 'PATCH', body: JSON.stringify(body) }); renderUsers(); }
  catch (e) { alert('操作失败：' + e.message); }
}
function resetPwd(id, name) {
  const p = prompt(`为 ${name} 设置新密码（至少6位）：`);
  if (p === null) return;
  if (p.length >= 6) patchUser(id, { password: p }); else alert('密码至少6位');
}
async function delUser(id, name) {
  if (!confirm(`确定删除用户 ${name}？`)) return;
  try { await api('/api/users/' + id, { method: 'DELETE' }); renderUsers(); }
  catch (e) { alert('删除失败：' + e.message); }
}
async function createUser() {
  try {
    await api('/api/users', { method: 'POST', body: JSON.stringify({ username: $('nu_name').value, password: $('nu_pass').value, display_name: $('nu_disp').value, role: $('nu_role').value }) });
    renderUsers();
  } catch (e) { $('nu_err').textContent = '创建失败：' + e.message; }
}

/* ---------- 右栏 ---------- */
async function loadReminders() {
  try {
    const reminders = await api('/api/tax/reminders?within_days=30');
    $('rp_reminders').innerHTML = reminders.length
      ? reminders.map(r2 => `<div class="remind">${r2.due_date}<br>${r2.tax}</div>`).join('')
      : '<div class="result">30 天内无征期</div>';
  } catch (e) { $('rp_reminders').textContent = '加载失败'; }
}

async function loadSummary() {
  try {
    const is = await api(`/api/reports/income-statement?book_id=${BOOK.id}&period=${PERIOD}`);
    const bs = await api(`/api/reports/balance-sheet?book_id=${BOOK.id}&period=${PERIOD}`);
    const get = (rows, key) => (rows.find(r2 => r2.key === key) || {}).month || '0.00';
    $('rp_summary').innerHTML = `
      <div class="kv"><span>营业收入</span><b>${get(is.rows, 'operating_revenue')}</b></div>
      <div class="kv"><span>净利润</span><b>${is.month_net_profit}</b></div>
      <div class="kv"><span>资产总计</span><b>${bs.total_assets}</b></div>
      <div class="kv"><span>未分配利润</span><b>${(bs.rows.find(r2 => r2.key === 'undistributed_profits') || {}).closing || '0.00'}</b></div>`;
  } catch (e) { $('rp_summary').textContent = '加载失败'; }
}

document.querySelectorAll('#sideNav div').forEach(el => {
  el.addEventListener('click', () => switchView(el.dataset.view));
});

if (TOKEN) { boot().catch(() => {}); } else { $('l_pass').focus(); }
</script>
</body>
