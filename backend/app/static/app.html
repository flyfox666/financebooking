<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有数 LedgerAI · 主界面</title>
<style>
  :root { --ink:#1f2733; --muted:#5d6675; --rule:#e0ddd4; --accent:#0f766e; --soft:#e6f2f0; --danger:#b91c1c; --amber:#b45309; --amber-soft:#fbf0e2; --bg:#faf9f6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  .hidden { display:none !important; }
  .layout { display:grid; grid-template-columns:150px minmax(0,1fr) 230px; height:100vh; }
  .topbar { grid-column:1/4; display:flex; align-items:center; gap:1rem; padding:.5rem 1rem; background:#fff; border-bottom:2px solid var(--ink); flex-wrap:wrap; }
  .topbar .brand { font-weight:700; color:var(--accent); }
  .topbar select, .topbar input { padding:.25rem .5rem; border:1px solid var(--rule); border-radius:6px; }
  .topbar .spacer { flex:1; }
  .side { border-right:1px solid var(--rule); background:#fff; padding:.6rem .4rem; overflow-y:auto; }
  .side div { padding:.55rem .8rem; border-radius:8px; cursor:pointer; margin-bottom:.15rem; white-space:nowrap; }
  .side div:hover { background:var(--soft); }
  .side div.active { background:var(--soft); color:var(--accent); font-weight:700; }
  .main { overflow:auto; padding:1rem 1.2rem; }
  .rpanel { border-left:1px solid var(--rule); background:#fff; padding:.8rem; overflow-y:auto; }
  .rpanel h4 { font-size:.8rem; color:var(--accent); margin:.6rem 0 .3rem; }
  .rpanel .kv { display:flex; justify-content:space-between; font-size:.8rem; padding:.15rem 0; }
  .rpanel .sum-group { font-size:.7rem; color:var(--accent); border-top:1px dashed var(--rule); margin-top:.45rem; padding-top:.4rem; }
  .rpanel .sum-group:first-child { border-top:none; margin-top:0; padding-top:0; }
  .rpanel .kv b.chip-link { cursor:pointer; color:var(--accent); text-decoration:underline; }
  .rpanel .remind { background:var(--amber-soft); border-radius:6px; padding:.4rem .5rem; font-size:.75rem; margin-bottom:.3rem; }
  .card { background:#fff; border:1px solid var(--rule); border-radius:10px; padding:.8rem 1rem; margin-bottom:.8rem; }
  .bubble { max-width:88%; margin-bottom:.7rem; padding:.55rem .8rem; border-radius:10px; white-space:pre-wrap; font-size:.88rem; }
  .bubble.user { background:var(--soft); margin-left:auto; }
  .bubble.ai { background:#fff; border:1px solid var(--rule); }
  .bubble .warn { background:var(--amber-soft); color:var(--amber); border-radius:6px; padding:.25rem .5rem; margin:.25rem 0; font-size:.8rem; }
  table { width:100%; border-collapse:collapse; font-size:.82rem; background:#fff; }
  th { background:var(--ink); color:#fff; padding:.4rem .5rem; text-align:left; white-space:nowrap; }
  td { padding:.35rem .5rem; border-bottom:1px solid var(--rule); }
  tr:last-child td { border-bottom:none; }
  td.num, th.num { text-align:right; font-family:Consolas,monospace; }
  .total-row td { font-weight:700; background:var(--soft); }
  .rollup-row td { font-weight:700; background:#f4f2ec; }
  input, select, textarea { padding:.35rem .5rem; border:1px solid var(--rule); border-radius:6px; font-size:.85rem; }
  button { padding:.4rem .9rem; border:none; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; font-size:.85rem; }
  button.ghost { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  button.danger { background:var(--danger); }
  button.small { padding:.15rem .5rem; font-size:.75rem; }
  button:disabled { background:#ccc; cursor:not-allowed; }
  .vc-line { display:grid; grid-template-columns:1fr 140px 110px 110px 90px 90px 26px; gap:.35rem; margin-bottom:.35rem; align-items:center; }
  .vc-totals { display:flex; gap:1.2rem; justify-content:flex-end; font-family:Consolas,monospace; font-size:.85rem; padding:.4rem 0; }
  .diff-bad { color:var(--danger); font-weight:700; }
  .diff-ok { color:var(--accent); font-weight:700; }
  .chips { display:flex; gap:.4rem; flex-wrap:wrap; margin:.4rem 0; }
  .chip { background:#fff; border:1px solid var(--rule); border-radius:14px; padding:.2rem .7rem; font-size:.78rem; cursor:pointer; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  .chip.on { border-color:var(--accent); color:var(--accent); font-weight:700; }
  #loginView { max-width:360px; margin:12vh auto; }
  #loginView input { width:100%; margin-bottom:.7rem; }
  .inputbar { display:flex; gap:.5rem; align-items:center; background:#fff; border:1px solid var(--rule); border-radius:10px; padding:.5rem; flex:none; }
  .inputbar input[type=text] { flex:1; border:none; outline:none; }
  .chat-view { display:flex; flex-direction:column; height:100%; min-height:0; }
  .chat-flow { flex:1; min-height:0; overflow-y:auto; padding-right:.3rem; }
  .badge { font-size:.72rem; padding:.1rem .5rem; border-radius:10px; background:var(--soft); color:var(--accent); font-weight:700; }
  .badge.gray { background:#eee; color:var(--muted); }
  h3.view-title { margin-bottom:.8rem; }
  a.link { color:var(--accent); text-decoration:underline; cursor:pointer; }

  /* ---- 响应式适配 ---- */
  @media (max-width:1024px) {
    .layout { grid-template-columns:150px minmax(0,1fr); }
    .rpanel { display:none; }
  }
  @media (max-width:680px) {
    .layout { grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr); height:100vh; height:100dvh; }
    .topbar { grid-column:1; padding:.45rem .6rem; gap:.5rem; }
    .side { grid-column:1; display:flex; overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--rule); padding:.3rem .4rem; }
    .side div { margin-bottom:0; padding:.4rem .65rem; flex:none; }
    .main { grid-column:1; padding:.8rem .7rem; }
    .card { overflow-x:auto; }
    .vc-line { min-width:600px; }
    table { min-width:520px; }
    .bubble { max-width:96%; }
  }

</style>
</head>
<body>

<div id="loginView" class="card">
  <h3 style="margin-bottom:.8rem">有数 LedgerAI · 登录</h3>
  <input id="l_user" placeholder="用户名" value="admin">
  <input id="l_pass" type="password" placeholder="密码">
  <button style="width:100%" onclick="login()">登录</button>
  <div id="l_err" style="color:var(--danger);font-size:.82rem;margin-top:.5rem"></div>
</div>

<div class="layout hidden" id="mainView">
  <div class="topbar">
    <span class="brand">有数</span>
    <select id="bookSwitch" onchange="switchBook(this.value)"
      style="font-weight:600;padding:.15rem .5rem;border:1px solid var(--rule);border-radius:6px;max-width:240px;font-size:.9rem;background:var(--soft)">
    </select>
    <span>期间 <input type="month" id="period" onchange="onPeriodChange()"></span>
    <span class="spacer"></span>
    <span id="whoami" class="badge gray"></span>
    <button class="ghost" onclick="logout()">退出</button>
  </div>

  <div class="side" id="sideNav">
    <div data-view="chat">💬 记账助手</div>
    <div class="active" data-view="vouchers">📋 凭证</div>
    <div data-view="accounts">🗂 科目设置</div>
    <div data-view="contacts">🤝 往来单位</div>
    <div data-view="tb">📊 科目余额表</div>
    <div data-view="reports">📑 报表模块</div>
    <div data-view="opening">🏁 期初余额</div>
    <div data-view="invoices">🧾 发票</div>
    <div data-view="tax">💰 报税</div>
    <div data-view="users">👥 用户管理</div>
    <div data-view="aistyle">🧩 AI 偏好</div>
    <div data-view="llm">🤖 模型设置</div>
  </div>

  <div class="main" id="mainArea"></div>

  <div class="rpanel">
    <h4>⏰ 征期提醒（30 天内）</h4>
    <div id="rp_reminders">…</div>
    <h4>💡 本期概要</h4>
    <div id="rp_summary">…</div>
  </div>
</div>

<script>
let TOKEN = localStorage.getItem('ledger_token') || '';
let ROLE = localStorage.getItem('ledger_role') || '';
let BOOKS = [];                    // 可访问账套列表
let BOOK = { id: 1, name: '' };     // 当前账套
let PERIOD = new Date().toISOString().slice(0, 7);
let ACCOUNTS = [];
let CONTACTS = [];
let currentView = 'vouchers';
let chatLog = [];

/* 期间按账套记忆（防切换串期间） */
function loadPeriodForBook() {
  const saved = localStorage.getItem('ledger_period_' + BOOK.id);
  PERIOD = saved || new Date().toISOString().slice(0, 7);
  $('period').value = PERIOD;
}

async function boot() {
  const me = await api('/api/auth/me');
  ROLE = me.role;
  localStorage.setItem('ledger_role', ROLE);
  $('whoami').textContent = `${me.display_name || me.username}（${ROLE_CN[me.role] || me.role}）`;
  // 可访问账套列表（admin 全部；成员为被授权账套）
  try { BOOKS = await api('/api/books'); }
  catch (e) { BOOKS = []; }
  if (!BOOKS.length) {
    $('bookSwitch').innerHTML = '<option>未找到账套</option>';
    if (ROLE === 'admin') {
      // 空模板首启：数据库尚无任何账套——admin 有权自建，直接引导创建第一个账套（而非死胡同）
      $('loginView').classList.add('hidden');
      $('mainView').classList.remove('hidden');
      showNewBookForm(true);
    } else {
      alert('当前账号没有可访问的账套，请联系管理员');
    }
    return;
  }
  // 恢复上次选择（或第一个）
  const lastId = parseInt(localStorage.getItem('ledger_book') || '0');
  const target = BOOKS.find(b => b.id === lastId) || BOOKS[0];
  BOOK = target;
  renderBookSwitch();
  loadPeriodForBook();
  $('loginView').classList.add('hidden');
  $('mainView').classList.remove('hidden');
  if (ROLE !== 'admin') { const ai = document.querySelector('[data-view="aistyle"]'); if (ai) ai.style.display = 'none'; }
  await loadMasters();
  await Promise.all([loadReminders(), loadSummary()]);
  switchView('vouchers');
}

function renderBookSwitch() {
  const sel = $('bookSwitch');
  sel.innerHTML = BOOKS.map(b => `<option value="${b.id}"${b.id === BOOK.id ? ' selected' : ''}>${b.name}${b.taxpayer_type === 'general' ? '（一般纳税人）' : ''}</option>`).join('')
    + (ROLE === 'admin' ? '<option value="__new__">＋ 新建账套…</option>' : '');
  sel.value = String(BOOK.id);
}

async function switchBook(bookId) {
  if (bookId === '__new__') { renderBookSwitch(); showNewBookForm(); return; }
  const target = BOOKS.find(b => String(b.id) === String(bookId));
  if (!target || target.id === BOOK.id) { renderBookSwitch(); return; }
  BOOK = target;
  localStorage.setItem('ledger_book', String(BOOK.id));
  // 账套隔离：清空 AI 对话历史（防 A 账套上下文泄入 B 账套会话）与主数据缓存
  chatLog = [];
  ACCOUNTS = []; CONTACTS = []; TPL_CACHE = null; CHECKS_CACHE = null; TB_UNPOSTED = 'none';
  renderBookSwitch();
  loadPeriodForBook();
  $('mainArea').innerHTML = '<div class="card">切换账套中…</div>';
  try {
    await loadMasters();
    await Promise.all([loadReminders(), loadSummary()]);
    switchView(currentView === 'llm' ? 'vouchers' : currentView);
  } catch (e) { $('mainArea').innerHTML = `<div class="card" style="color:var(--danger)">切换失败：${e.message}</div>`; }
}

function showNewBookForm(firstRun = false) {
  $('mainArea').innerHTML = `<h3 class="view-title">${firstRun ? '📁 欢迎使用有数 LedgerAI · 创建你的第一个账套' : '📁 新建账套'}</h3>
    <div class="card" style="max-width:560px">
      <div style="display:grid;gap:.7rem">
        <label>企业名称 <input id="nb_name" placeholder="如：上海某某科技有限公司" style="width:100%"></label>
        <label>统一社会信用代码（选填） <input id="nb_taxno" placeholder="18 位" style="width:100%"></label>
        <label>纳税人身份
          <select id="nb_taxpayer" style="width:100%"><option value="small_scale">小规模纳税人</option><option value="general">一般纳税人</option></select>
        </label>
        <label>启用期间 <input type="month" id="nb_start" value="${PERIOD}" style="width:100%"></label>
      </div>
      <div style="display:flex;gap:.6rem;margin-top:.9rem;align-items:center">
        <button onclick="createNewBook()">创建并切换</button>
        ${firstRun ? '' : `<button class="ghost" onclick="switchView('vouchers')">取消</button>`}
        <span id="nb_err" style="color:var(--danger);font-size:.85rem"></span>
      </div>
      <div class="result" style="margin-top:.7rem">创建后自动预置 66 科目、报表模板与税务参数；先到「🏁 期初余额」录入期初，再开始记账。</div>
    </div>`;
}

async function createNewBook() {
  const name = $('nb_name').value.trim();
  try {
    const book = await api('/api/books', { method: 'POST', body: JSON.stringify({
      name,
      tax_no: $('nb_taxno').value.trim(),
      taxpayer_type: $('nb_taxpayer').value,
      entity_type: 'company',
      start_period: $('nb_start').value,
    }) });
    BOOKS.push(book);
    BOOK = book;
    localStorage.setItem('ledger_book', String(book.id));
    chatLog = []; ACCOUNTS = []; CONTACTS = []; TPL_CACHE = null; CHECKS_CACHE = null;
    renderBookSwitch();
    loadPeriodForBook();
    await loadMasters();
    await Promise.all([loadReminders(), loadSummary()]);
    switchView('opening');  // 新账套直接引导录期初
  } catch (e) { $('nb_err').textContent = e.message; }
}

const $ = id => document.getElementById(id);
const STATUS_CN = { draft:'草稿', submitted:'待审核', audited:'已审核', posted:'已过账', voided:'已冲销' };
const SOURCE_CN = { manual:'手工', ai:'AI生成', carryover:'结转', reverse:'红冲' };
const ROLE_CN = { admin:'管理员', bookkeeper:'制单', auditor:'审核' };
const CTYPE_CN = { customer:'客户', supplier:'供应商', employee:'员工', other:'其他往来' };

async function errorText(resp) {
  const data = await resp.json().catch(() => ({}));
  const d = data.detail;
  if (typeof d === 'string') return d;
  if (Array.isArray(d) && d.length) return d.map(x => x.msg || JSON.stringify(x)).join('；');
  return 'HTTP ' + resp.status;
}

async function api(path, options = {}) {
  const resp = await fetch(path, {
    ...options,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN, ...(options.headers || {}) },
  });
  if (resp.status === 401) { logout(true); throw new Error('登录已失效'); }
  if (resp.status === 204) return null;
  if (!resp.ok) throw new Error(await errorText(resp));
  return resp.json();
}

function logout(expired) {
  localStorage.removeItem('ledger_token');
  TOKEN = '';
  $('mainView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  if (expired) $('l_err').textContent = '登录已失效，请重新登录';
}

async function login() {
  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('l_user').value, password: $('l_pass').value }),
    });
    if (!resp.ok) throw new Error((await resp.json()).detail || '登录失败');
    TOKEN = (await resp.json()).access_token;
    localStorage.setItem('ledger_token', TOKEN);
    await boot();
  } catch (e) { $('l_err').textContent = e.message; }
}

async function loadMasters() {
  const [tree, contacts] = await Promise.all([
    api(`/api/accounts?book_id=${BOOK.id}&only_active=false`),
    api(`/api/contacts?book_id=${BOOK.id}`),
  ]);
  const flat = [];
  (function walk(nodes) { nodes.forEach(n => { flat.push(n); if (n.children) walk(n.children); }); })(tree);
  ACCOUNTS = flat;
  CONTACTS = contacts;
}

function onPeriodChange() {
  PERIOD = $('period').value;
  localStorage.setItem('ledger_period_' + BOOK.id, PERIOD);  // 按账套记忆期间
  loadSummary();
  if (currentView !== 'chat') switchView(currentView);
}

function updateNav() {
  document.querySelectorAll('#sideNav div').forEach(el => {
    el.classList.toggle('active', el.dataset.view === currentView);
  });
}

function switchView(view) {
  if (view === 'llm') { window.open('/settings', '_blank'); return; }
  currentView = view;
  updateNav();
  ({ chat: renderChat, vouchers: renderVouchers, accounts: renderAccounts, contacts: renderContactsView, tb: renderTB, reports: renderReports,
     opening: renderOpening, invoices: renderInvoices, tax: renderTax, users: renderUsers, aistyle: renderAiStyle })[view]();
}

function addBubble(html, cls = 'ai') {
  chatLog.push({ html, cls });
  const wrap = document.createElement('div');
  wrap.className = 'bubble ' + cls;
  wrap.innerHTML = html;
  const flow = $('chatFlow');
  if (!flow) return;
  flow.appendChild(wrap);
  flow.scrollTop = flow.scrollHeight;
}

/* ---------- 对话视图（标准主视图） ---------- */
function renderChat() {
  if (!chatLog.length) {
    chatLog.push({ html: '你好，我是记账助手 🤖<br>直接描述业务（如「支付阿里云服务器费 3200 元」）或点 📎 上传发票/单据，我来生成凭证；也可以随时提问查数据。', cls: 'ai' });
  }
  $('mainArea').innerHTML = `
    <div class="chat-view">
      <h3 class="view-title" style="flex:none">💬 记账助手</h3>
      <div id="chatFlow" class="chat-flow"></div>
      <div class="chips" id="chips"></div>
      <div class="inputbar">
        <input type="file" id="chatFile" class="hidden">
        <button class="ghost" onclick="$('chatFile').click()" title="上传单据">📎</button>
        <input type="text" id="chatInput" placeholder="输入业务描述，或上传单据文件（回车发送）" onkeydown="if(event.key==='Enter')send()">
        <button class="ghost" onclick="newManualCard()">＋ 新增凭证</button>
        <button onclick="send()">发送</button>
      </div>
    </div>`;
  const flow = $('chatFlow');
  chatLog.forEach(m => { const div = document.createElement('div'); div.className = 'bubble ' + m.cls; div.innerHTML = m.html; flow.appendChild(div); });
  flow.scrollTop = flow.scrollHeight;
  ['本月收入多少', '本月费用有哪些', '这个月利润', '看看余额表'].forEach(q => {
    const c = document.createElement('span');
    c.className = 'chip'; c.textContent = q;
    c.onclick = () => { $('chatInput').value = q; send(); };
    $('chips').appendChild(c);
  });
  $('chatFile').onchange = () => { if ($('chatFile').files[0]) send(); };
  fitVoucherLines();
}

function contactOptions(selected, allowedTypes) {
  const usable = CONTACTS.filter(c =>
    c.is_active && (!allowedTypes || !allowedTypes.length || allowedTypes.includes(c.ctype)));
  return `<option value="">往来单位</option>` +
    usable.map(c =>
      `<option value="${c.id}" ${Number(selected) === c.id ? 'selected' : ''}>${c.name}（${CTYPE_CN[c.ctype] || c.ctype}）</option>`).join('');
}

function auxTypesOf(accountCode) {
  const a = ACCOUNTS.find(x => x.code === accountCode);
  return (a && a.aux_types ? a.aux_types : '')
    .split(',').filter(Boolean).map(x => x.replace('contact:', '')).filter(x => x !== 'contact');
}

let _edSeq = 0;
const CF_ITEMS = {
  sales: '销售收现', invest_return: '投资收益', asset_dispose: '处置资产', capital_in: '吸收投资', borrow_in: '取得借款', other_in: '其他经营收现',
  purchase: '购买商品', staff: '职工薪酬', taxes: '税费', capex: '购建资产', invest_out: '投资支付', borrow_repay: '偿还债务', dividend: '分红付息', other_out: '其他经营付现',
};
const isCashAcct = code => ['1001', '1002', '1012'].includes(String(code || '').slice(0, 4));
function cfSelectHTML(line, i, updFn) {
  if (!isCashAcct(line.account_code)) return '<span></span>';
  return `<select onchange="${updFn}(${i},'cf_item',this.value||null)" title="现金流量项目">
    <option value="">现金流量</option>
    ${Object.entries(CF_ITEMS).map(([k, label]) => `<option value="${k}" ${line.cf_item === k ? 'selected' : ''}>${label}</option>`).join('')}
  </select>`;
}
function lineEditorHTML(lines, updFn, delFn) {
  return `<div class="vc-lines-box">` + lines.map((line, i) => `
    <div class="vc-line">
      <input value="${line.summary || ''}" placeholder="摘要" onchange="${updFn}(${i},'summary',this.value)">
      <select onchange="${updFn}(${i},'account_code',this.value)">
        <option value="">选择科目</option>
        ${ACCOUNTS.filter(a => a.is_active && a.is_leaf).map(a =>
          `<option value="${a.code}" ${a.code === line.account_code ? 'selected' : ''}>${a.code} ${a.name}</option>`).join('')}
      </select>
      <select onchange="${updFn}(${i},'contact_id',this.value?parseInt(this.value):null)">
        ${contactOptions(line.contact_id, auxTypesOf(line.account_code))}
      </select>
      ${cfSelectHTML(line, i, updFn)}
      <input class="num" data-field="debit" value="${line.debit || ''}" placeholder="借方（按=平衡）" onchange="amtChange(this,'${updFn}',${i},'debit')" onkeydown="amtKey(event,this)">
      <input class="num" data-field="credit" value="${line.credit || ''}" placeholder="贷方（按=平衡）" onchange="amtChange(this,'${updFn}',${i},'credit')" onkeydown="amtKey(event,this)">
      <button class="small danger" onclick="${delFn}(${i})">×</button>
    </div>`).join('') + '</div>';
}

/* 金额工具：解析任意输入为数字（容错空串/千分位逗号/货币符），失焦格式化两位小数，按 = 填平衡金额 */
function amtNum(v) { const n = parseFloat(String(v ?? '').replace(/[,\s¥￥]/g, '')); return isNaN(n) ? 0 : n; }

function amtChange(input, updFn, i, field) {
  const raw = String(input.value).trim();
  input.value = raw === '' ? '' : amtNum(raw).toFixed(2);
  window[updFn](i, field, input.value);
}

function amtKey(e, input) {
  if (e.key !== '=') return;
  e.preventDefault();
  const scope = input.closest('.vc-lines-box') || document;
  let debit = 0, credit = 0;
  scope.querySelectorAll('input.num[data-field]').forEach(inp => {
    if (inp === input) return;
    if (inp.dataset.field === 'debit') debit += amtNum(inp.value);
    else credit += amtNum(inp.value);
  });
  // 贷方：借合计-贷合计；借方：贷合计-借合计（排除本行，可为负，负号表示应记对方方向）
  const val = input.dataset.field === 'credit' ? debit - credit : credit - debit;
  input.value = val.toFixed(2);
  input.dispatchEvent(new Event('change'));
}

function normLines(lines) {
  return lines.map(l => ({ ...l, debit: amtNum(l.debit).toFixed(2), credit: amtNum(l.credit).toFixed(2) }));
}

function totalsHTML(lines) {
  const total = lines.reduce((acc, l) => acc + (parseFloat(l.debit) || 0), 0);
  const diff = (lines.reduce((acc, l) => acc + (parseFloat(l.debit) || 0) - (parseFloat(l.credit) || 0), 0)).toFixed(2);
  const ok = Math.abs(diff) < 0.005;
  return { total, diff, ok, html: `<div class="vc-totals"><span>借方合计 ${total.toFixed(2)}</span><span>贷方合计 ${total.toFixed(2)}</span><span class="${ok ? 'diff-ok' : 'diff-bad'}">差额 ${diff}</span></div>` };
}

function cardHTML(v, mode) {
  const t = totalsHTML(v.lines);
  return `
    <div class="card" id="vcCard">
      <div style="display:flex;gap:.8rem;align-items:center;margin-bottom:.5rem;flex-wrap:wrap">
        <b>凭证日期</b><input type="date" id="vc_date" value="${v.voucher_date}">
        <b>附单据数</b><input id="vc_att" type="number" min="0" value="${v.attachment_count ?? 1}" style="width:60px">
        <span class="badge ${mode === 'ai' ? '' : 'gray'}">${mode === 'ai' ? 'AI 生成 · 可编辑' : mode === 'reference' ? '依据合同/报价单生成 · 建议附发票' : '手工录入'}</span>
      </div>
      <div class="vc-line" style="font-weight:700;color:var(--muted)"><span>摘要</span><span>科目</span><span>往来单位</span><span>现金流量</span><span style="text-align:right">借方</span><span style="text-align:right">贷方</span><span></span></div>
      ${lineEditorHTML(v.lines, 'updLine', 'delLine')}
      <button class="small ghost" onclick="addLine()">＋ 加一行</button>
      ${t.html}
      <div id="vc_err" style="color:var(--danger);font-size:.82rem"></div>
      <button id="vc_confirm" onclick="confirmCard('${mode}')" ${t.ok ? '' : 'disabled'}>确认落账</button>
      ${mode !== 'manual' ? `<button class="ghost" onclick="reSuggest()">重新生成</button>` : ''}
    </div>`;
}

let cardState = { mode: 'ai', voucher: null, docId: null };

function showCard(mode, voucher, docId) {
  cardState = { mode, voucher, docId };
  addBubble(cardHTML(voucher, mode));
  fitVoucherLines();
}

function updLine(i, field, value) { cardState.voucher.lines[i][field] = value; refreshCardTotals(); }
function addLine() { cardState.voucher.lines.push({ summary: '', account_code: '', contact_id: null, cf_item: null, debit: '', credit: '' }); rerenderCard(); }
function delLine(i) { cardState.voucher.lines.splice(i, 1); rerenderCard(); }

/* 凭证分录行整体缩放：容器窄于行自然宽度时等比缩小，保证借贷框始终完整可见 */
function fitVoucherLines() {
  document.querySelectorAll('.vc-fit').forEach(fit => {
    fit.style.zoom = '';
    const ps = getComputedStyle(fit.parentElement);
    const avail = fit.parentElement.clientWidth - (parseFloat(ps.paddingLeft) + parseFloat(ps.paddingRight) || 0);
    const nat = fit.scrollWidth;
    if (nat > avail && nat > 0) fit.style.zoom = Math.max(0.55, avail / nat).toFixed(3);
  });
}
window.addEventListener('resize', fitVoucherLines);

function rerenderCard() {
  const card = document.getElementById('vcCard');
  if (card) { card.outerHTML = cardHTML(cardState.voucher, cardState.mode); const f = $('chatFlow'); f.scrollTop = f.scrollHeight; }
  fitVoucherLines();
}
function refreshCardTotals() {
  const card = document.getElementById('vcCard');
  if (!card) return;
  const t = totalsHTML(cardState.voucher.lines);
  card.querySelector('.vc-totals').outerHTML = t.html;
  card.querySelector('#vc_confirm').disabled = !t.ok;
}

      { summary: '', account_code: '', contact_id: null, cf_item: null, debit: '', credit: '' },

let CHAT_HISTORY = [];
let pendingAsk = null;
const TOOL_CN = {
  search_invoices: '查发票', query_balance: '查科目余额', query_vouchers: '查凭证',
  list_contacts: '列往来单位', search_contacts: '查往来档案', find_or_create_contact: '新建往来单位', ask_user: '向用户提问',
  check_duplicate: '重复入账检测', 'check_duplicate(hard)': '重复入账检测（系统强制）',
  'sanitize_contacts(hard)': '往来单位校验（系统强制）',
};

async function send() {
  const text = $('chatInput').value.trim();
  const file = $('chatFile').files[0];
  if (!text && !file) return;
  addBubble((text || '') + (file ? ` 📎${file.name}` : ''), 'user');
  $('chatInput').value = ''; $('chatFile').value = '';

  if (/^看(看)??(余额表|资产负债表|利润表|现金流量表|凭证|发票|报税)/.test(text)) {
    const map = { 余额表: 'tb', 资产负债表: 'reports', 利润表: 'reports', 现金流量表: 'reports', 凭证: 'vouchers', 发票: 'invoices', 报税: 'tax' };
    const view = Object.keys(map).find(k => text.includes(k));
    addBubble(`好的，为你打开对应视图 👉`);
    switchView(map[view]);
    return;
  }

  try {
    if (pendingAsk && !file) {
      CHAT_HISTORY.push({ role: 'user', content: text });
      await agentChat(pendingAsk.docId);
      return;
    }
    let doc;
    if (file) {
      const form = new FormData();
      form.append('file', file);
      const resp = await fetch(`/api/ai/parse?book_id=${BOOK.id}`, { method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN }, body: form });
      if (!resp.ok) throw new Error(await errorText(resp));
      doc = await resp.json();
      const warnHtml = (doc.warnings || []).map(w => `<div class="warn">⚠ ${w}</div>`).join('');
      const head = doc.degraded ? '⚠ 自动识别失败，原件已保存' : `📄 已解析（${doc.source_kind}）`;
      addBubble(`${head}：${Object.values(doc.fields).filter(v => v).join(' ｜ ') || '无字段'}${warnHtml}`);
    } else {
      const form = new FormData();
      form.append('note', text);
      const resp = await fetch(`/api/ai/parse?book_id=${BOOK.id}`, { method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN }, body: form });
      if (!resp.ok) throw new Error(await errorText(resp));
      doc = await resp.json();
    }
    CHAT_HISTORY.push({ role: 'user', content: text || `[文件] ${file.name}` });
    await agentChat(doc.doc_id);
    const extras = doc.extra_doc_ids || [];
    for (let i = 0; i < extras.length; i++) {
      if (pendingAsk) { addBubble(`⏸ 检测到还有 ${extras.length - i} 张票据待处理：先回答上面的问题；处理完后可重新上传或逐张描述`); break; }
      addBubble(`📄 继续处理下一张票据（${i + 2}/${extras.length + 1}）…`);
      await agentChat(extras[i]);
    }
  } catch (e) { addBubble(`❌ ${e.message}`); }
}

async function agentChat(docId) {
  const body = $('chatFlow');   // 用户中途切走视图时为 null，气泡已入 chatLog，切回时重放
  const thinking = document.createElement('div');
  thinking.className = 'bubble ai';
  thinking.textContent = '⏳ 正在思考（可能需要查数据）…';
  if (body) { body.appendChild(thinking); body.scrollTop = body.scrollHeight; }
  let data;
  try {
    data = await api('/api/ai/chat', {
      method: 'POST',
      body: JSON.stringify({ book_id: BOOK.id, doc_id: docId, history: CHAT_HISTORY }),
    });
  } finally {
    thinking.remove();
  }
  (data.trace || []).forEach(t => addTrace(t));
  // 智能体可能新建了往来档案：先刷新主数据缓存，凭证卡片下拉才能选到新档案
  if ((data.trace || []).some(t => t.tool === 'find_or_create_contact')) await loadMasters();
  CHAT_HISTORY.push({ role: 'assistant', content: data.reply });
  if (data.stopped_by_ask_user) {
    pendingAsk = { docId };
    addBubble(`🤖 ${data.reply}`);
    return;
  }
  pendingAsk = null;
  if (data.voucher) {
    data.voucher.lines.forEach(l => { if (l.contact_id === undefined) l.contact_id = null; if (l.cf_item === undefined) l.cf_item = null; });
    addBubble(`🤖 ${data.reply || '凭证已生成，请核对：'}`);
    showCard(data.doc_type === 'reference' ? 'reference' : 'ai', data.voucher, docId);
  } else {
    addBubble(`🤖 ${data.reply || '（无内容）'}`);
  }
}

function addTrace(t) {
  const box = $('chatFlow');
  if (!box) return;
  const args = Object.entries(t.arguments || {}).map(([k, v]) => (v ? `${k}=${v}` : '')).filter(Boolean).join(' ');
  const div = document.createElement('div');
  div.className = 'trace';
  div.textContent = `🛠 ${TOOL_CN[t.tool] || t.tool}${args ? ' · ' + args : ''}`;
  box.appendChild(div); box.scrollTop = box.scrollHeight;
}

async function reSuggest() {
  if (!cardState.docId) return;
  await agentChat(cardState.docId);
}

async function confirmCard(mode) {
  const card = document.getElementById('vcCard');
  const voucher_date = card.querySelector('#vc_date').value;
  const attachment_count = parseInt((card.querySelector('#vc_att') || {}).value || '0', 10);
  const errEl = card.querySelector('#vc_err');
  try {
    let voucher;
    if (mode === 'ai' || mode === 'reference') {
      voucher = await api('/api/ai/confirm', {
        method: 'POST',
        body: JSON.stringify({ doc_id: cardState.docId, voucher_date, lines: normLines(cardState.voucher.lines) }),
      });
    } else {
      voucher = await api(`/api/vouchers?book_id=${BOOK.id}`, {
        method: 'POST',
        body: JSON.stringify({ voucher_date, attachment_count, source: 'manual', lines: normLines(cardState.voucher.lines) }),
      });
    }
    addBubble(`✅ 已落账：${voucher.voucher_no_display}（${STATUS_CN[voucher.status]}，待审核）`);

    pendingAsk = null; loadSummary(); if (currentView === 'vouchers') renderVouchers(); if (currentView === 'invoices') renderInvoices();

}

/* ---------- 凭证模块 ---------- */
let VE = null;
let V_STATUS = '';       // 状态筛选（跨重渲染保留，修复选中即重置的 bug）
let V_PERIOD = '';        // 凭证模块独立期间选择（默认跟全局 PERIOD）
let V_SEL = new Set();   // 批量操作勾选的凭证 id
let V_MSG = '';          // 批量操作结果提示

async function renderVouchers() {
  if (!V_PERIOD) V_PERIOD = PERIOD;
  $('mainArea').innerHTML = `<h3 class="view-title">📋 凭证
    <input type="month" value="${V_PERIOD}" onchange="vPeriodChanged(this.value)" style="margin-left:.6rem">
    <select onchange="vStatusChanged(this.value)" style="margin-left:.6rem">
      <option value="">全部状态</option>${Object.keys(STATUS_CN).map(s => `<option value="${s}" ${V_STATUS === s ? 'selected' : ''}>${STATUS_CN[s]}</option>`).join('')}
    </select>
    <button class="ghost small" style="margin-left:.6rem" onclick="newManualCard()">＋ 新建凭证</button></h3>
    ${V_MSG ? `<div class="result" style="margin-bottom:.5rem">${V_MSG}</div>` : ''}
    <div id="v_batch"></div><div id="v_list">加载中…</div>`;
  vRenderToolbar();
  const list = await api(`/api/vouchers?book_id=${BOOK.id}&period=${V_PERIOD}${V_STATUS ? '&status=' + V_STATUS : ''}`);

    list.map(v => `<tr><td><input type="checkbox" data-id="${v.id}" ${V_SEL.has(v.id) ? 'checked' : ''} onchange="vToggle(${v.id}, this.checked)"></td>
      <td><a class="link" onclick="viewVoucher(${v.id})">${v.voucher_no_display}</a></td>
      <td>${v.voucher_date}</td><td>${STATUS_CN[v.status] || v.status}</td><td>${SOURCE_CN[v.source] || v.source}</td><td class="num">${v.total_debit}</td>
      <td><button class="small ghost" onclick="viewVoucher(${v.id})">查看${v.status === 'draft' ? '/编辑' : ''}</button></td></tr>`).join('') + '</table>'
    : '<div class="result">本期暂无凭证</div>';
}

function vStatusChanged(v) { V_STATUS = v; V_SEL.clear(); V_MSG = ''; renderVouchers(); }
function vPeriodChanged(p) { if (p) { V_PERIOD = p; V_SEL.clear(); V_MSG = ''; renderVouchers(); } }
function vToggle(id, checked) { checked ? V_SEL.add(id) : V_SEL.delete(id); vRenderToolbar(); }
function vToggleAll(cb) {
  document.querySelectorAll('#v_list input[type=checkbox][data-id]').forEach(c => {
    const id = parseInt(c.dataset.id);
    if (id) { cb.checked ? V_SEL.add(id) : V_SEL.delete(id); c.checked = cb.checked; }
  });
  vRenderToolbar();
}

function vRenderToolbar() {
  const bar = $('v_batch');
  if (!bar) return;
  const n = V_SEL.size;
  const dis = n ? '' : ' disabled title="先勾选凭证左侧的复选框"';
  const b = (label, action, cls) => `<button class="small ${cls || 'ghost'}" style="margin-right:.35rem" onclick="vBatch('${action}')" ${dis}>${label}</button>`;
  bar.innerHTML = `<div class="card" style="padding:.45rem .7rem;display:flex;gap:.35rem;align-items:center;margin-bottom:.6rem;flex-wrap:wrap">
    <span style="margin-right:.3rem;font-size:.85rem">已选 <b>${n}</b> 条</span>
    ${b('提交审核', 'submit', '')}
    ${ROLE !== 'bookkeeper' ? b('审核通过', 'audit', '') + b('驳回', 'reject', '') + b('过账', 'post', '') + b('反过账', 'unpost', '') : ''}
    ${b('删除草稿', 'delete', 'danger')}</div>`;
}

async function vBatch(action) {
  const labels = { submit: '提交审核', audit: '审核通过', reject: '驳回', post: '过账', unpost: '反过账', delete: '删除' };
  if (action === 'delete' && !confirm(`确定删除选中的 ${V_SEL.size} 张凭证？（仅草稿状态可删）`)) return;
  try {
    const r = await api('/api/vouchers/batch', { method: 'POST', body: JSON.stringify({ ids: [...V_SEL], action }) });
    V_SEL.clear();
    V_MSG = r.failed.length
      ? `⚠ 已${labels[action]} ${r.ok.length} 条，失败 ${r.failed.length} 条：${r.failed.map(f => `第${f.id}号 ${f.error}`).join('；')}`
      : `✅ 已${labels[action]} ${r.ok.length} 条`;
    await renderVouchers();
    loadSummary();
  } catch (e) { alert('批量操作失败：' + e.message); }
}

async function viewVoucher(id) {
  const v = await api(`/api/vouchers/${id}`);
  v.lines.forEach(l => { if (l.contact_id === undefined) l.contact_id = null; });
  VE = { id, voucher: JSON.parse(JSON.stringify(v)), editable: v.status === 'draft', atts: [] };
  renderVoucherDetail();
  loadAttachments(id);
}

async function loadAttachments(id) {
  if (! $('vc_atts_btn')) return;
  try {
    VE.atts = await api(`/api/vouchers/${id}/attachments`);
  } catch (e) { VE.atts = []; }

  if ($('att_modal')) renderAttModal();
}

function fmtSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

function toggleAttModal() {
  if ($('att_modal')) { closeAttModal(); return; }
  const ov = document.createElement('div');
  ov.id = 'att_modal';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(31,39,51,.35);z-index:300;display:flex;align-items:center;justify-content:center';
  ov.onclick = e => { if (e.target === ov) closeAttModal(); };
  ov.innerHTML = `<div style="background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);min-width:420px;max-width:560px;max-height:70vh;overflow:auto;padding:1rem 1.2rem">
    <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem">
      <b>📎 电子原件（${(VE.atts || []).length}）</b>

      <span style="flex:1"></span>

function closeAttModal() { const m = $('att_modal'); if (m) m.remove(); }

function renderAttModal() {
  const box = $('att_list');
  if (!box) return;
  const list = VE.atts || [];
  box.innerHTML = list.length
    ? `<table><tr><th>文件名</th><th style="width:70px">大小</th><th style="width:130px">操作</th></tr>` +
      list.map(a => `<tr><td><a class="link" onclick="openAttachment(${a.id})">📎 ${a.original_filename}</a></td><td class="num">${fmtSize(a.file_size)}</td><td><button class="small ghost" onclick="openAttachment(${a.id})">打开</button> <button class="small danger" onclick="delAttachment(${a.id})">删除</button></td></tr>`).join('') + '</table>'
    : '<div style="color:var(--muted);font-size:.85rem;padding:.6rem 0">暂无电子原件，点「＋ 上传」添加</div>';
}

async function delAttachment(aid) {
  const a = (VE.atts || []).find(x => x.id === aid);
  if (!a || !confirm(`确定删除附件「${a.original_filename}」？`)) return;
  try {
    const resp = await fetch(`/api/vouchers/${VE.id}/attachments/${aid}`, { method: 'DELETE', headers: { Authorization: 'Bearer ' + TOKEN } });
    if (!resp.ok && resp.status !== 204) throw new Error(await errorText(resp));
    VE.atts = VE.atts.filter(x => x.id !== aid);
    const btn = $('vc_atts_btn'); if (btn) btn.textContent = `📎 附件（${VE.atts.length}）`;
    renderAttModal();
    const v = await api(`/api/vouchers/${VE.id}`);
    if (v && v.attachment_count !== undefined) { $('vc_att_count').textContent = v.attachment_count; }
  } catch (e) { alert('删除失败：' + e.message); }
}

async function openAttachment(aid) {
  try {
    const resp = await fetch(`/api/vouchers/${VE.id}/attachments/${aid}/download`, { headers: { Authorization: 'Bearer ' + TOKEN } });
    if (!resp.ok) throw new Error(await errorText(resp));
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { alert('打开失败：' + e.message); }
}

async function uploadAttachment() {
  const files = Array.from($('vc_att_file').files || []);
  if (!files.length) return;
  let lastErr = '';
  for (const f of files) {
    try {
      const form = new FormData();
      form.append('file', f);
      const resp = await fetch(`/api/vouchers/${VE.id}/attachments`, { method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN }, body: form });
      if (!resp.ok) lastErr = await errorText(resp);
    } catch (e) { lastErr = e.message; }
  }
  if (lastErr) alert('部分文件上传失败：' + lastErr);
  const v = await api(`/api/vouchers/${VE.id}`);
  VE.voucher = v;
  $('vc_att_count').textContent = v.attachment_count;
  loadAttachments(VE.id);
}

function renderVoucherDetail() {
  const v = VE.voucher;
  const contactName = id => (CONTACTS.find(c => c.id === id) || {}).name || '';

  const t = totalsHTML(v.lines);
  $('mainArea').innerHTML = `

    <div class="card">
      <div style="margin-bottom:.5rem">凭证日期 <b>${v.voucher_date}</b> ｜ 附单据数 <b id="vc_att_count">${v.attachment_count}</b> ｜ 期间 ${v.period}
        <button id="vc_atts_btn" class="small ghost" style="margin-left:.6rem" onclick="toggleAttModal()">📎 附件（…）</button></div>
      ${VE.editable ? `
        <div class="vc-fit"><div class="vc-line" style="font-weight:700;color:var(--muted)"><span>摘要</span><span>科目</span><span>往来单位</span><span>现金流量</span><span style="text-align:right">借方</span><span style="text-align:right">贷方</span><span></span></div>
        ${linesHtml}</div>
        <button class="small ghost" onclick="veAdd()">＋ 加一行</button>
        ${t.html}
        <div id="ve_err" style="color:var(--danger);font-size:.82rem"></div>
        <button onclick="veSave()" ${t.ok ? '' : 'disabled'}>保存修改</button>
        <button class="ghost" onclick="veSubmit()">提交审核</button>
        <button class="danger" onclick="veDelete()">删除凭证</button>`
      : `${linesHtml}
        <div class="vc-totals"><span>借方合计 ${v.total_debit}</span><span>贷方合计 ${v.total_credit}</span></div>
        ${ROLE !== 'bookkeeper' && v.status === 'submitted' ? `<button onclick="act('${v.id}','audit')">审核通过</button> <button class="ghost" onclick="act('${v.id}','reject')">驳回</button>` : ''}
        ${ROLE !== 'bookkeeper' && v.status === 'audited' ? `<button onclick="act('${v.id}','post')">过账</button>` : ''}
        ${ROLE !== 'bookkeeper' && v.status === 'posted' ? `<button class="ghost" onclick="act('${v.id}','unpost')">反过账</button> <button class="danger" onclick="veReverse()">红字冲销</button>` : ''}`}
    </div>`;
  fitVoucherLines();
}

function veUpd(i, field, value) {
  VE.voucher.lines[i][field] = value;

function veAdd() { VE.voucher.lines.push({ summary: '', account_code: '', contact_id: null, debit: '0', credit: '0' }); renderVoucherDetail(); }

async function renderAccounts() {
  $('mainArea').innerHTML = `<h3 class="view-title">🗂 科目设置</h3><div id="aux_panel"></div><div id="acc_body">加载中…</div>

      <div class="result">往来单位档案请前往「🤝 往来单位」模块维护。</div></div>`;

function renderAccountTree() {
  const children = {};
  ACCOUNTS.forEach(a => {
    const key = a.parent_code || '_root';
    (children[key] = children[key] || []).push(a);
  });
  const rows = [];
  (function walk(list, depth) {
    list.sort((x, y) => x.code.localeCompare(y.code)).forEach(a => {
      const auxTypes = auxTypesOf(a.code);
      rows.push(`
        <tr class="${a.level === 1 ? 'rollup-row' : ''}" style="${a.is_active ? '' : 'opacity:.5'}">
          <td style="padding-left:${depth * 1.2}rem">${a.code} ${a.name}${a.is_preset ? '' : ' <span class="badge gray">自建</span>'}</td>
          <td>${auxTypes.length ? auxTypes.map(t => `<span class="badge">${CTYPE_CN[t] || t}</span>`).join('') : ''}</td>
          <td>${a.is_active ? '<span class="badge">启用</span>' : '<span class="badge gray">停用</span>'}</td>
          <td>${ROLE === 'admin' ? `
            <button class="small ghost" onclick="toggleAccount('${a.code}',${a.is_active})">${a.is_active ? '停用' : '启用'}</button>
            <button class="small ghost" onclick="openAuxEditor('${a.code}')">辅助核算</button>` : ''}</td>
        </tr>`);
      if (children[a.code]) walk(children[a.code], depth + 1);
    });
  })(children['_root'] || [], 0);
  $('acc_body').innerHTML = `<table><tr><th>科目</th><th>辅助核算（往来类型）</th><th>状态</th><th>操作（管理员）</th></tr>${rows.join('')}</table>
    <div class="result" style="margin-top:.5rem">说明：启用辅助核算后，录凭证选该科目必须选择对应类型的往来单位；默认已按标准配置（应收/预收→客户，应付/预付→供应商，其他应收/应付→员工与其他往来）；有发生额的科目修改配置会收到警示，修改对新凭证生效。</div>`;
}

function openAuxEditor(code) {
  auxEditCode = code;
  const account = ACCOUNTS.find(a => a.code === code);
  const current = auxTypesOf(code);
  const panel = $('aux_panel');
  panel.innerHTML = `<div class="card" style="border-color:var(--accent)">
    <b>辅助核算配置：${account.code} ${account.name}</b>
    <div class="chips" style="margin:.5rem 0">
      ${Object.keys(CTYPE_CN).map(t => `<span class="chip ${current.includes(t) ? 'on' : ''}" onclick="toggleAuxChip('${t}',this)">${CTYPE_CN[t]}</span>`).join('')}
    </div>
    <div id="aux_warn" style="color:var(--amber);font-size:.82rem"></div>
    <button onclick="saveAux('${code}')">保存配置</button>
    <button class="ghost" onclick="auxEditCode=null;$('aux_panel').innerHTML=''">取消</button>
    <div class="result">勾选即启用该类型的往来辅助核算；取消全部勾选=关闭辅助核算。</div>
  </div>`;
  panel.scrollIntoView({ behavior: 'smooth' });
}

function toggleAuxChip(type, el) {
  el.classList.toggle('on');
}

async function saveAux(code) {
  const panel = $('aux_panel');
  const types = [...panel.querySelectorAll('.chip.on')].map(el =>
    Object.keys(CTYPE_CN).find(k => CTYPE_CN[k] === el.textContent));
  try {
    const r = await api(`/api/accounts/${code}/aux?book_id=${BOOK.id}&aux_types=${types.map(t => 'contact:' + t).join(',')}`, { method: 'PATCH' });
    await loadMasters();
    renderAccountTree();
    $('aux_warn').textContent = r.warning || '配置已保存';
    if (r.warning) { const w = $('aux_warn'); w.style.color = 'var(--amber)'; }
  } catch (e) { $('aux_warn').textContent = '保存失败：' + e.message; $('aux_warn').style.color = 'var(--danger)'; }
}

async function toggleAccount(code, isActive) {
  try { await api(`/api/accounts/${code}?book_id=${BOOK.id}`, { method: 'PATCH', body: JSON.stringify({ is_active: !isActive }) }); await loadMasters(); renderAccountTree(); }
  catch (e) { alert('操作失败：' + e.message); }

/* ---------- AI 偏好（行业标签 + 业务描述 + 自定义模板） ---------- */
let AI_STYLE = { tags: [], business_desc: '', style_prompt: '' };
let asDirty = false; // 自定义模板编辑器是否被手动修改过（改过则标签联动不覆盖）

async function renderAiStyle() {
  $('mainArea').innerHTML = `<h3 class="view-title">🧩 AI 偏好</h3>
    <div class="card">
      <b>一、行业标签</b><span style="color:var(--muted)">（可多选，组合业务如「软件+电商」都选上）</span>

        <textarea id="as_desc" rows="4" style="width:100%;margin-top:.5rem;padding:.5rem;border:1px solid var(--rule);border-radius:6px;font-family:inherit"

        <div style="text-align:right;color:var(--muted);font-size:.8rem"><span id="as_count">0</span> / 1000</div>
      </div>
    </div>
    <div class="card" style="margin-top:.8rem">
      <b>三、自定义模板 · AI 将这样理解你的公司</b><span style="color:var(--muted)">（按标签自动生成，可直接修改；不选标签直接编写即为纯自定义模板）</span>
      <textarea id="as_prompt" rows="10" style="width:100%;margin-top:.5rem;padding:.5rem;border:1px solid var(--rule);border-radius:6px;font-family:inherit;font-size:.85rem;line-height:1.6"
        placeholder="（未配置——记账助手按通用风格处理；可直接编写自定义内容）"
        oninput="asDirty=true; $('as_pcount').textContent=this.value.length"></textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:.3rem">
        <button onclick="asRegen()">↻ 按标签重新生成</button>

      </div>
      <div style="color:var(--muted);font-size:.8rem;margin-top:.4rem">🔒 系统自动附加护栏：此内容仅辅助理解业务、辅助科目选择与摘要风格，不会凌驾记账规则与安全要求</div>
      <div style="display:flex;align-items:center;gap:.8rem;margin-top:.8rem">
        <button id="as_save" onclick="saveAiStyle()">保存</button>
        <span id="as_msg" style="font-size:.85rem"></span>
      </div>
    </div>`;
  let lib;
  try { lib = await api(`/api/books/${BOOK.id}/ai-style`); }
  catch (e) { $('as_msg').textContent = '加载失败：' + e.message; return; }
  AI_STYLE = lib.current;
  asDirty = false;
  const tagsBox = $('as_tags');
  lib.tags.forEach(t => {
    const c = document.createElement('span');
    c.className = 'chip' + (AI_STYLE.tags.includes(t.id) ? ' on' : '');
    c.textContent = t.name;
    c.title = t.desc;
    c.onclick = () => { c.classList.toggle('on'); asAutoRefresh(); };
    c.dataset.id = t.id;
    c.dataset.prompt = t.prompt;
    tagsBox.appendChild(c);
  });
  $('as_desc').value = AI_STYLE.business_desc;
  $('as_count').textContent = AI_STYLE.business_desc.length;
  // 编辑器初始值 = 所见即所得：有自定义模板用它，否则按当前标签+描述合成
  const saved = (AI_STYLE.style_prompt || '').trim();
  $('as_prompt').value = saved || asSynthesize();
  $('as_pcount').textContent = $('as_prompt').value.length;
}

// 按当前选中标签 + 业务描述合成模板文本（与后端 _style_segment 合成规则一致）
function asSynthesize() {
  const on = [...document.querySelectorAll('#as_tags .chip.on')].map(c => c.dataset.prompt);
  const desc = $('as_desc').value.trim();
  const parts = [...on, desc ? '业务描述：' + desc : ''];
  return parts.join('\n');
}

// 标签/描述变化联动：编辑器未被手动修改时才自动刷新（防覆盖用户输入）
function asAutoRefresh() {
  if (asDirty) return;
  $('as_prompt').value = asSynthesize();
  $('as_pcount').textContent = $('as_prompt').value.length;
}

// 放弃手动修改，按当前标签+描述重新生成
function asRegen() {
  asDirty = false;
  $('as_prompt').value = asSynthesize();
  $('as_pcount').textContent = $('as_prompt').value.length;
}

async function saveAiStyle() {
  const tags = [...document.querySelectorAll('#as_tags .chip.on')].map(c => c.dataset.id);
  const business_desc = $('as_desc').value.trim();
  const style_prompt = $('as_prompt').value.trim();
  if (business_desc.length > 1000) { $('as_msg').textContent = '❌ 业务描述超过 1000 字'; return; }
  if (style_prompt.length > 2000) { $('as_msg').textContent = '❌ 自定义模板超过 2000 字'; return; }
  $('as_save').disabled = true;
  try {
    await api(`/api/books/${BOOK.id}/ai-style`, { method: 'PUT', body: JSON.stringify({ tags, business_desc, style_prompt }) });
    $('as_msg').textContent = '✅ 已保存，下次对话即生效';
    AI_STYLE = { tags, business_desc, style_prompt };
  } catch (e) { $('as_msg').textContent = '❌ ' + e.message; }
  $('as_save').disabled = false;
}

/* ---------- 科目余额表（完整树形） ---------- */
let TB_UNPOSTED = 'none'; // 科目余额表未过账口径：none 仅已过账 / pending 含待审+已审 / all 含草稿

/* 勾稽校验徽章（run_checks 结果 → 紧凑提示条，余额表与报表体检共用） */
function checkBadgeHTML(c) {
  const chips = [];
  if (c.direction.issues.length) chips.push(`<span class="badge" style="border-color:var(--danger);color:var(--danger)">⚠️ 方向异常 ${c.direction.issues.length} 项</span>`);
  chips.push(`<span class="badge">${c.profit.ok ? '✅' : '❌'} 未分配利润勾稽${c.profit.ok ? '' : ' ' + c.profit.diff}</span>`);
  chips.push(`<span class="badge">${c.cash.ok ? '✅' : '❌'} 货币资金↔现金流${c.cash.ok ? '' : ' ' + c.cash.diff}</span>`);
  chips.push(`<span class="badge">${c.continuity.ok ? '✅' : '⚠️'} 跨期衔接</span>`);
  return `<div style="display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0">${chips.join('')}</div>`;
}
function checkDetailHTML(c) {
  const parts = [];
  if (c.direction.issues.length) {
    const list = c.direction.issues.map(i => `${i.code} ${i.name}：期末${i.balance_side}方 ${i.balance}（应${i.expected_side}方${i.is_active ? '' : '，已停用'}）`).join('；');
    parts.push(`<div class="remind">⚠️ 方向/余额异常：${list}</div>`);
  }
  if (!c.profit.ok) parts.push(`<div class="remind">未分配利润本年变动 ${c.profit.change} ≠ 本年净利润 ${c.profit.ytd_net_profit}，差额 ${c.profit.diff}（${c.profit.note}）</div>`);
  if (!c.cash.ok) parts.push(`<div class="remind">货币资金期末 ${c.cash.monetary_closing} ≠ 现金流量表期末 ${c.cash.cashflow_closing}（${c.cash.note}）</div>`);
  if (!c.continuity.ok) parts.push(`<div class="remind">跨期衔接异常：${c.continuity.issues.map(i => i.code + ' 期初 ' + i.opening + ' ≠ 上期期末 ' + i.prev_closing).join('；')}（${c.continuity.note}）</div>`);
  return parts.join('');
}

async function renderTB() {
  $('mainArea').innerHTML = `<h3 class="view-title" style="display:flex;align-items:center;gap:.7rem;flex-wrap:wrap">📊 科目余额表
    <input type="month" id="r_period" value="${PERIOD}" onchange="reportPeriodChanged(this.value)"

/* ---------- 报表模块 ---------- */
let reportTab = 'bs';

function renderReports() {
  $('mainArea').innerHTML = `<h3 class="view-title" style="display:flex;align-items:center;gap:.7rem;flex-wrap:wrap">📑 报表模块
    <input type="month" id="r_period" value="${PERIOD}" onchange="reportPeriodChanged(this.value)"
      style="font-weight:400;padding:.15rem .4rem;border:1px solid var(--rule);border-radius:6px;font-size:.95rem">
  </h3>
    <div class="chips" id="r_tabs"></div><div id="t_body">加载中…</div>`;
  [['bs', '资产负债表'], ['is', '利润表'], ['cf', '现金流量表'], ['tpl', '映射体检']].forEach(([key, label]) => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (reportTab === key ? ' on' : '');
    chip.textContent = label;
    chip.onclick = () => { reportTab = key; renderReports(); };
    $('r_tabs').appendChild(chip);
  });
  loadReport(reportTab);
}

function reportPeriodChanged(v) {
  if (!v) return;
  PERIOD = v;
  localStorage.setItem('ledger_period_' + BOOK.id, PERIOD);  // 按账套记忆期间
  $('period').value = v;   // 双向同步门楣期间
  loadSummary();           // 右栏概要跟随切换
  if (currentView !== 'chat') switchView(currentView);  // 保持当前视图/报表页签，按新月份重查
}

async function loadReport(kind) {
  try {
    if (kind === 'bs') {
      const r = await api(`/api/reports/balance-sheet?book_id=${BOOK.id}&period=${PERIOD}`);
      $('t_body').innerHTML = `<div class="badge">${r.total_assets === r.total_liabilities_and_equity ? '✅ 资产 = 负债 + 权益' : '❌ 不平衡'}</div>
        <table><tr><th>项目</th><th class="num">期末余额</th><th class="num">年初余额</th></tr>` +
        r.rows.map(row => `<tr class="${row.bold ? 'total-row' : ''}"><td>${row.name}</td><td class="num">${row.closing}</td><td class="num">${row.year_begin}</td></tr>`).join('') + '</table>';
    } else if (kind === 'is') {
      const r = await api(`/api/reports/income-statement?book_id=${BOOK.id}&period=${PERIOD}`);
      $('t_body').innerHTML = `<table><tr><th>项目</th><th class="num">本月金额</th><th class="num">本年累计金额</th></tr>` +
        r.rows.map(row => `<tr class="${row.bold ? 'total-row' : ''}"><td>${row.name}</td><td class="num">${row.month}</td><td class="num">${row.year_to_date}</td></tr>`).join('') + '</table>';
    } else if (kind === 'tpl') {
      TPL_CACHE = await api(`/api/reports/template-check?book_id=${BOOK.id}&period=${PERIOD}`);
      CHECKS_CACHE = await api(`/api/reports/checks?book_id=${BOOK.id}&period=${PERIOD}`);
      renderTpl();
    } else {
      const r = await api(`/api/reports/cash-flow?book_id=${BOOK.id}&period=${PERIOD}`);
      $('t_body').innerHTML = `<table><tr><th>项目</th><th class="num">本月金额</th><th class="num">本年累计金额</th></tr>` +
        r.rows.map(row => `<tr class="${row.bold ? 'total-row' : ''}"><td>${row.name}</td><td class="num">${row.month}</td><td class="num">${row.year_to_date}</td></tr>`).join('') + '</table>' +
        `<div class="result" style="margin-top:.5rem">口径：直接法；现金内部划转已剔除；净增加额与现金类科目变动自动对账。</div>`;
    }
  } catch (e) { $('t_body').innerHTML = `<div class="result" style="color:var(--danger)">加载失败：${e.message}</div>`; }
}

let TPL_CACHE = null, TPL_EDIT = null, CHECKS_CACHE = null;
function acctLabel(code) { const a = ACCOUNTS.find(x => x.code === code); return a ? a.name : ''; }

function renderTpl() {
  const r = TPL_CACHE;
  if (!r) return;
  const repName = { bs: '资产负债表', is: '利润表' };
  const unmapped = r.unmapped || [];
  const unmappedBal = unmapped.filter(a => a.has_balance);
  const dirty = (r.dirty_refs || []).length
    ? `<div class="remind">⚠️ 模板引用了账套中不存在的科目：${r.dirty_refs.map(d => `${repName[d.report]} ${d.code}`).join('、')}</div>` : '';
  const unmappedRows = unmapped.length
    ? `<table><tr><th>科目</th><th class="num">期末余额</th><th>提示</th></tr>` +
      unmapped.map(a => `<tr${a.has_balance ? ' style="color:var(--danger);font-weight:700"' : ''}><td>${a.code} ${a.name}${a.is_active ? '' : '（停用）'}</td><td class="num">${a.has_balance ? a.closing : '—'}</td><td>${a.has_balance ? '⚠️ 有余额，余额不会进任何报表' : '无余额，暂不影响报表'}</td></tr>`).join('') + '</table>'
    : '<div class="result">✅ 所有叶子科目均已映射到报表</div>';
  const tplTables = ['bs', 'is'].map(rep => {
    const rows = (r.rows[rep] || []).map(row => {
      let codes;
      if (TPL_EDIT && TPL_EDIT.rep === rep && TPL_EDIT.key === row.key) {
        codes = tplEditorHtml();
      } else {
        codes = (row.codes || []).length
          ? row.codes.map(c => `<span class="badge gray" style="margin-right:.3rem">${c.sign}${c.code} ${c.name || '<b style="color:var(--danger)">科目不存在</b>'}</span>`).join('')
          : '<span style="color:var(--muted)">（计算行）</span>';
      }
      const editBtn = row.kind === 'line'
        ? `<button class="small ghost" onclick="tplEdit('${rep}','${row.key}')">编辑</button>` : '';
      return `<tr${row.kind === 'calc' ? ' class="rollup-row"' : ''}><td>${row.name}</td><td>${codes}</td><td style="width:60px">${editBtn}</td></tr>`;
    }).join('');
    return `<div style="display:flex;align-items:center;gap:.6rem;margin:.9rem 0 .3rem"><h4 style="margin:0">${repName[rep]}（行 → 科目）</h4>
      <button class="small ghost" onclick="resetTpl('${rep}')">恢复默认模板</button></div>
      <table><tr><th style="width:200px">报表项目</th><th>取数科目（符号+编码）</th><th>操作</th></tr>${rows}</table>`;
  }).join('');
  $('t_body').innerHTML = `
    <div class="badge">${r.bs_identity_ok ? '✅' : '❌'} 资产总计 ${r.total_assets} ${r.bs_identity_ok ? '=' : '≠'} 负债和所有者权益总计 ${r.total_liabilities_and_equity}</div>
    <div class="badge">${unmappedBal.length ? '⚠️' : '✅'} 未映射科目 ${unmapped.length} 个（其中 ${unmappedBal.length} 个有余额）</div>
    ${dirty}
    ${CHECKS_CACHE ? checkBadgeHTML(CHECKS_CACHE) + checkDetailHTML(CHECKS_CACHE) : ''}
    <h4 style="margin:.8rem 0 .3rem">未映射科目（科目 → 报表）</h4>${unmappedRows}
    ${tplTables}
    <div class="result" style="margin-top:.6rem">点「编辑」修改该报表行取哪些科目（+ 取借方/贷方正常方向，− 反向扣减）；未分配利润行默认并入全部损益科目（表结法，期中报表恒平衡）。「恢复默认模板」覆盖该报表全部映射；体检基于 ${PERIOD} 期末余额。</div>`;
}

function tplEditorHtml() {
  const items = TPL_EDIT.items;
  const chips = items.length
    ? items.map((it, i) => `<span class="badge gray" style="margin-right:.3rem">${it.sign}${it.code} ${acctLabel(it.code) || '<b style="color:var(--danger)">科目不存在</b>'} <b style="cursor:pointer;color:var(--danger)" onclick="tplDelItem(${i})" title="移除">✕</b></span>`).join('')
    : '<span style="color:var(--muted)">（空映射，该行恒为 0.00）</span>';
  const opts = ACCOUNTS.map(a => `<option value="${a.code}">${a.code} ${a.name}${a.is_active ? '' : '（停用）'}</option>`).join('');
  return `<div style="padding:.3rem 0">
    <div style="margin-bottom:.35rem">${chips}</div>
    <div style="display:flex;gap:.4rem;align-items:center">
      <select id="tpl_sign" style="width:52px"><option value="+">＋</option><option value="-">－</option></select>
      <select id="tpl_code" style="flex:1;min-width:180px">${opts}</select>
      <button class="small" onclick="tplAddItem()">添加</button>
      <button class="small" onclick="tplSave()">保存</button>
      <button class="small ghost" onclick="tplCancel()">取消</button>
    </div></div>`;
}

function tplEdit(rep, key) {
  const row = (TPL_CACHE.rows[rep] || []).find(r => r.key === key);
  if (!row) return;
  TPL_EDIT = { rep, key, items: (row.codes || []).map(c => ({ code: c.code, sign: c.sign })) };
  renderTpl();
}
function tplCancel() { TPL_EDIT = null; renderTpl(); }
function tplDelItem(i) { TPL_EDIT.items.splice(i, 1); renderTpl(); }
function tplAddItem() {
  const code = $('tpl_code').value, sign = $('tpl_sign').value;
  if (TPL_EDIT.items.some(it => it.code === code)) { alert('该科目已在映射中'); return; }
  TPL_EDIT.items.push({ code, sign });
  renderTpl();
}
async function tplSave() {
  const { rep, key, items } = TPL_EDIT;
  const formula = items.map(it => [it.code, it.sign === '+' ? 1 : -1]);
  try {
    await api(`/api/reports/template-row?book_id=${BOOK.id}&report=${rep}&key=${key}`, { method: 'PUT', body: JSON.stringify(formula) });
    TPL_EDIT = null;
    TPL_CACHE = await api(`/api/reports/template-check?book_id=${BOOK.id}&period=${PERIOD}`);
    renderTpl();
  } catch (e) { alert('保存失败：' + e.message); }
}

async function resetTpl(rep) {
  const name = rep === 'bs' ? '资产负债表' : '利润表';
  if (!confirm(`确定恢复${name}默认模板？当前账套该报表的全部取数公式将被覆盖，报表数字会随之变化。`)) return;
  try {
    const r = await api(`/api/reports/template-reset?book_id=${BOOK.id}&report=${rep}`, { method: 'POST' });
    loadReport('tpl');
  } catch (e) { alert('重置失败：' + e.message); }
}

/* ---------- 期初余额 ---------- */
async function renderOpening() {
  const canEdit = ROLE === 'admin';
  $('mainArea').innerHTML = `<h3 class="view-title">🏁 期初余额录入</h3><div id="t_body">加载中…</div>`;
  try {
    const [existing] = await Promise.all([api(`/api/books/${BOOK.id}/opening`)]);
    const map = {};
    existing.forEach(o => { map[o.account_code] = o; });
    const leaves = ACCOUNTS.filter(a => a.is_leaf);
    const rows = leaves.map(a => `<tr><td>${a.code} ${a.name}${a.is_active ? '' : ' <span class="badge gray">停用</span>'}</td>
      <td class="num"><input data-code="${a.code}" data-side="debit" value="${(map[a.code] || {}).debit ? parseFloat(map[a.code].debit) : ''}" placeholder="0" style="width:120px;text-align:right" ${canEdit ? '' : 'disabled'}></td>
      <td class="num"><input data-code="${a.code}" data-side="credit" value="${(map[a.code] || {}).credit ? parseFloat(map[a.code].credit) : ''}" placeholder="0" style="width:120px;text-align:right" ${canEdit ? '' : 'disabled'}></td></tr>`).join('');
    $('t_body').innerHTML = `<div class="result">录入启用期间（${BOOK.start_period}）之前各科目的期末余额；保存时自动试算平衡；账套已存在过账凭证后不允许修改。</div>
      <table><tr><th>科目</th><th class="num">期初借方</th><th class="num">期初贷方</th></tr>${rows}</table>
      <div class="vc-totals" id="op_totals"></div><div id="op_err" style="color:var(--danger)"></div>
      ${canEdit ? '<button onclick="saveOpening()">保存期初余额</button>' : '<div class="result">仅管理员可保存</div>'}`;
    updOpeningTotals();
    document.querySelectorAll('#t_body input').forEach(inp => inp.addEventListener('input', updOpeningTotals));
  } catch (e) { $('t_body').innerHTML = `<div class="result" style="color:var(--danger)">${e.message}</div>`; }
}

function updOpeningTotals() {
  let dr = 0, cr = 0;
  document.querySelectorAll('#t_body input').forEach(inp => {
    const v = parseFloat(inp.value) || 0;
    if (inp.dataset.side === 'debit') dr += v; else cr += v;
  });
  const el = document.getElementById('op_totals');
  if (el) el.innerHTML = `<span>借方合计 ${dr.toFixed(2)}</span><span>贷方合计 ${cr.toFixed(2)}</span><span class="${Math.abs(dr - cr) < 0.005 ? 'diff-ok' : 'diff-bad'}">差额 ${(dr - cr).toFixed(2)}</span>`;
}

async function saveOpening() {
  const seen = {};
  document.querySelectorAll('#t_body input').forEach(inp => {
    const v = parseFloat(inp.value);
    if (!v) return;
    const item = seen[inp.dataset.code] || { account_code: inp.dataset.code, debit: '0', credit: '0' };
    item[inp.dataset.side] = v.toFixed(2);
    seen[inp.dataset.code] = item;
  });
  const items = Object.values(seen);
  if (!items.length) { alert('请至少录入一条期初余额'); return; }
  try {
    await api(`/api/books/${BOOK.id}/opening`, { method: 'PUT', body: JSON.stringify({ items }) });
    alert('期初余额保存成功，余额表与报表的期初数已更新');
    loadSummary();
  } catch (e) { document.getElementById('op_err').textContent = '保存失败：' + e.message; }
}

let INV_KIND = '';    // 发票方向筛选：'' 全部 / sales / purchase
let INV_LIST = [];    // 当前列表缓存，供一键 AI 记账取数
const INV_TYPE_CN = { special: '专票', general: '普票', digital: '数电' };
const INV_STATUS_CN = { normal: '正常', red: '红冲', void: '作废' };

async function renderInvoices() {
  $('mainArea').innerHTML = `
    <h3 class="view-title">🧾 发票</h3>
    <div class="card">
      <b>导入金税 Excel</b>
      <div style="display:flex;gap:.5rem;margin-top:.4rem;align-items:center;flex-wrap:wrap">

    </div>
    <div style="margin-bottom:.5rem">
      ${['', 'sales', 'purchase'].map(k => `<button class="small ${INV_KIND === k ? '' : 'ghost'}" style="margin-right:.35rem" onclick="INV_KIND='${k}';renderInvoices()">${k === '' ? '全部' : k === 'sales' ? '销项' : '进项'}</button>`).join('')}
    </div>
    <div id="inv_body">加载中…</div>`;

    ? `<table><tr><th>号码</th><th>日期</th><th>方向</th><th>类型</th><th>对方</th><th>品名</th><th class="num">价税合计</th><th>状态</th><th>记账</th></tr>` +
      INV_LIST.map(i => `<tr>
        <td>${i.invoice_no}</td><td>${i.invoice_date}</td>
        <td>${i.kind === 'sales' ? '销项' : '进项'}</td>

        <td>${INV_STATUS_CN[i.status] || i.status}</td>

          ? `<a class="link" onclick="viewVoucher(${i.voucher_id})">${i.voucher_no_display}</a>`
          : (i.status === 'normal' ? `<button class="small ghost" onclick="bookInvoice(${i.id})">AI记账</button>` : '—')}</td>
      </tr>`).join('') + '</table>'
    : '<div class="result">暂无发票，用上方入口导入金税 Excel。</div>';
}

async function importInvoices() {
  const file = $('inv_file').files[0];
  const msg = $('inv_msg');
  if (!file) { msg.textContent = '请先选择文件'; return; }
  msg.textContent = '导入中…';
  try {
    const form = new FormData();
    form.append('file', file);
    const resp = await fetch(`/api/invoices/import?book_id=${BOOK.id}&kind=${$('inv_kind').value}`,
      { method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN }, body: form });
    if (!resp.ok) throw new Error(await errorText(resp));
    const r = await resp.json();
    msg.textContent = `✅ 新增 ${r.created} 张 · 更新 ${r.updated} 张 · 跳过 ${r.skipped} 张`;
    $('inv_file').value = '';
    renderInvoices();
  } catch (e) { msg.textContent = '❌ ' + e.message; }
}

async function bookInvoice(id) {
  const inv = INV_LIST.find(x => x.id === id);
  if (!inv) return;
  if (pendingAsk) { alert('AI 助手正在等你回复上一个问题，请先处理'); return; }
  switchView('chat');
  const dir = inv.kind === 'sales' ? '销项' : '进项';
  const party = inv.kind === 'sales' ? `购买方「${inv.buyer_name}」` : `销售方「${inv.seller_name}」`;
  $('chatInput').value = `请为这张${dir}发票记账：发票号 ${inv.invoice_no}，开票日期 ${inv.invoice_date}，${party}，品名「${inv.goods_name}」，价税合计 ${inv.amount_total} 元。`;
  send();
}

async function renderTax() {
  const [y, m] = PERIOD.split('-');
  const quarter = Math.ceil(parseInt(m, 10) / 3);
  $('mainArea').innerHTML = `<h3 class="view-title">💰 报税（${y}Q${quarter}）</h3><div id="t_body">加载中…</div>`;
  const vat = await api(`/api/tax/vat?book_id=${BOOK.id}&year=${y}&quarter=${quarter}`);
  const cit = await api(`/api/tax/cit?book_id=${BOOK.id}&year=${y}&quarter=${quarter}`);
  const reminders = await api('/api/tax/reminders?within_days=60');
  $('t_body').innerHTML = `
    <div class="card"><b>增值税（${y}Q${quarter}）</b>
      <div class="kv">季度销售额 ${vat.quarter_total_incl} ｜ 起征点 ${vat.threshold} ｜ ${vat.exempt ? '✅ 免税' : '全额计税'}</div>
      <div class="kv">应纳增值税 <b>${vat.vat_payable}</b> ｜ 附加税费 ${vat.surtax.total}</div>
      <div class="result">${vat.hints.join('；')}</div></div>
    <div class="card"><b>企业所得税预缴</b>
      <div class="kv">累计利润 ${cit.profit_ytd} ｜ ${cit.actual_rate} ｜ 本期应预缴 <b>${cit.prepaid_this}</b></div></div>
    <div class="card"><b>申报辅助表</b><button class="ghost small" onclick="window.open('/api/tax/export?book_id=${BOOK.id}&year=${y}&quarter=${quarter}')">导出 Excel</button></div>
    <div class="card"><b>近 60 天征期</b>${reminders.map(r2 => `<div class="kv">⏰ ${r2.due_date} ${r2.tax}（${r2.period}）</div>`).join('') || '<div class="result">无</div>'}</div>`;
}

/* ---------- 用户管理 ---------- */
async function renderUsers() {
  if (ROLE !== 'admin') {
    $('mainArea').innerHTML = '<div class="result">用户管理需要管理员权限，请使用 admin 账号登录后访问。</div>';
    return;
  }
  $('mainArea').innerHTML = `<h3 class="view-title">👥 用户管理</h3><div id="t_body">加载中…</div>`;
  const users = await api('/api/users');
  $('t_body').innerHTML = `<table><tr><th>用户名</th><th>姓名</th><th>全局角色</th><th>状态</th><th>操作</th></tr>` +
    users.map(u => `<tr><td>${u.username}</td><td>${u.display_name || ''}</td>
      <td><select onchange="patchUser(${u.id},{role:this.value})">
        ${['admin', 'bookkeeper', 'auditor'].map(r2 => `<option value="${r2}" ${u.role === r2 ? 'selected' : ''}>${ROLE_CN[r2]}</option>`).join('')}
      </select></td>
      <td>${u.is_active ? '<span class="badge">启用</span>' : '<span class="badge gray">停用</span>'}</td>
      <td><button class="small ghost" onclick="grantBooks(${u.id},'${u.username}','${u.role}')">账套授权</button>
      <button class="small ghost" onclick="resetPwd(${u.id},'${u.username}')">重置密码</button>
      <button class="small ghost" onclick="patchUser(${u.id},{is_active:${!u.is_active}})">${u.is_active ? '停用' : '启用'}</button>
      <button class="small danger" onclick="delUser(${u.id},'${u.username}')">删除</button></td></tr>`).join('') + '</table>' +
    `<div class="card" style="margin-top:1rem"><b>新增用户</b>
      <div class="vc-line" style="grid-template-columns:1fr 1fr 1fr 1fr auto">
        <input id="nu_name" placeholder="用户名（≥3字符）"><input id="nu_pass" type="password" placeholder="密码（≥6字符）">
        <input id="nu_disp" placeholder="姓名"><select id="nu_role"><option value="bookkeeper">制单</option><option value="auditor">审核</option><option value="admin">管理员</option></select>
        <button onclick="createUser()">创建</button></div>
      <div id="nu_err" style="color:var(--danger);font-size:.82rem"></div>
      <div class="result"><b>角色怎么理解</b>：全局角色 = 岗位（制单/审核/管理员，全系统唯一，制审强制分离）；
      「账套授权」= 门禁卡（决定这个账号能进哪些公司的账，一个账号可挂多个账套）。
      管理员天然可见全部账套，无需授权。新建账套时创建者自动成为该账套管理员。</div></div>`;
}

/* 账套授权页（用户视角：勾选该用户可访问的账套 + 每账套账套级角色） */
async function grantBooks(userId, username, globalRole) {
  const [userBooks, allBooks] = await Promise.all([
    api(`/api/users/${userId}/books`),
    api('/api/books'),
  ]);
  const granted = new Map(userBooks.map(b => [b.book_id, b.role]));
  const rows = allBooks.map(b => {
    const role = granted.get(b.id) || '';
    return `<tr>
      <td>${b.name}${b.taxpayer_type === 'general' ? '（一般纳税人）' : ''}</td>
      <td style="text-align:center"><input type="checkbox" id="gb_${b.id}" ${role ? 'checked' : ''} onchange="gbToggle(${b.id})"></td>
      <td><select id="gbr_${b.id}" ${role ? '' : 'disabled'}>
        ${['bookkeeper', 'auditor', 'admin'].map(r2 => `<option value="${r2}" ${role === r2 ? 'selected' : ''}>${{bookkeeper:'制单',auditor:'审核',admin:'管理员'}[r2]}</option>`).join('')}
      </select></td>
    </tr>`;
  }).join('');
  $('mainArea').innerHTML = `<h3 class="view-title"><a class="link" onclick="renderUsers()">← 用户管理</a> ｜ 账套授权：${username}${globalRole === 'admin' ? '（全局管理员——天然可见所有账套，此处仅展示）' : ''}</h3>
    <div class="card" style="max-width:640px">
      <table><tr><th>账套</th><th style="width:80px">可访问</th><th>账套内角色</th></tr>${rows}</table>
      <div style="display:flex;gap:.6rem;margin-top:.9rem;align-items:center">
        <button onclick="saveGrant(${userId})">保存授权</button>
        <button class="ghost" onclick="renderUsers()">返回</button>
        <span id="gb_err" style="color:var(--danger);font-size:.85rem"></span>
      </div>
      <div class="result" style="margin-top:.7rem"><b>账套内角色</b>只影响该账套内的岗位展示（权限主干仍由全局角色决定）；
      取消勾选 = 收回门禁，该账号将看不到此账套。至少保留一个可管理的账套管理员（全局管理员或账套管理员成员）。</div>
    </div>`;
}

function gbToggle(bookId) {
  $('gbr_' + bookId).disabled = !$('gb_' + bookId).checked;
}

async function saveGrant(userId) {
  const books = [];
  for (const b of BOOKS) {
    if ($('gb_' + b.id) && $('gb_' + b.id).checked) {
      books.push({ book_id: b.id, role: $('gbr_' + b.id).value });
    }
  }
  try {
    await api(`/api/users/${userId}/books`, { method: 'PUT', body: JSON.stringify({ books }) });
    renderUsers();
  } catch (e) { $('gb_err').textContent = e.message; }
}

async function patchUser(id, body) {
  try { await api('/api/users/' + id, { method: 'PATCH', body: JSON.stringify(body) }); renderUsers(); }
  catch (e) { alert('操作失败：' + e.message); }
}
function resetPwd(id, name) {
  const p = prompt(`为 ${name} 设置新密码（至少6位）：`);
  if (p === null) return;
  if (p.length >= 6) patchUser(id, { password: p }); else alert('密码至少6位');
}
async function delUser(id, name) {
  if (!confirm(`确定删除用户 ${name}？`)) return;
  try { await api('/api/users/' + id, { method: 'DELETE' }); renderUsers(); }
  catch (e) { alert('删除失败：' + e.message); }
}
async function createUser() {
  try {
    await api('/api/users', { method: 'POST', body: JSON.stringify({ username: $('nu_name').value, password: $('nu_pass').value, display_name: $('nu_disp').value, role: $('nu_role').value }) });
    renderUsers();
  } catch (e) { $('nu_err').textContent = '创建失败：' + e.message; }
}

/* ---------- 右栏 ---------- */
async function loadReminders() {
  try {
    const reminders = await api('/api/tax/reminders?within_days=30');
    $('rp_reminders').innerHTML = reminders.length
      ? reminders.map(r2 => `<div class="remind">${r2.due_date}<br>${r2.tax}</div>`).join('')
      : '<div class="result">30 天内无征期</div>';
  } catch (e) { $('rp_reminders').textContent = '加载失败'; }
}

async function loadSummary() {
  try {
    const s = await api(`/api/reports/period-summary?book_id=${BOOK.id}&period=${PERIOD}`);
    const v = s.voucher_status;
    const kv = (label, val) => `<div class="kv"><span>${label}</span><b>${val ?? '0.00'}</b></div>`;
    const kvLink = (label, status, n) => `<div class="kv"><span>${label}</span><b class="chip-link" title="点击查看凭证" onclick="jumpVoucherStatus('${status}')">${n}</b></div>`;
    $('rp_summary').innerHTML = `
      <div class="sum-group">📄 凭证状态</div>
      ${kvLink('草稿', 'draft', v.draft)}
      ${kvLink('待审核', 'submitted', v.submitted)}
      ${kvLink('已审核', 'audited', v.audited)}
      ${kvLink('已过账', 'posted', v.posted)}
      <div class="sum-group">📈 本期经营</div>
      ${kv('营业收入', s.operating_revenue)}
      ${kv('净利润', s.net_profit)}
      <div class="sum-group">💰 资金与往来</div>
      ${kv('货币资金', s.monetary_funds)}
      ${kv('应收账款', s.accounts_receivable)}
      ${kv('应付账款', s.accounts_payable)}`;
  } catch (e) { $('rp_summary').textContent = '加载失败'; }
}
function jumpVoucherStatus(status) {
  V_STATUS = status; V_PERIOD = PERIOD; V_SEL.clear(); V_MSG = '';
  switchView('vouchers');
}

document.querySelectorAll('#sideNav div').forEach(el => {
  el.addEventListener('click', () => switchView(el.dataset.view));
});

if (TOKEN) { boot().catch(() => {}); } else { $('l_pass').focus(); }
</script>
</body>
